<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Knight's Deck — ต้นแบบ</title>
<style>
:root{--gold:#e6b422;--txt:#f1ece4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0c0a10;color:var(--txt);font-family:-apple-system,"Sukhumvit Set","Thonburi","Noto Sans Thai","Leelawadee UI",sans-serif;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;height:100dvh;background:radial-gradient(ellipse at top,#2c2240,#15121c 70%);position:relative;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:none;cursor:pointer;background:none}
.btn{background:linear-gradient(#e0ac3a,#9a6c16);color:#1a1206;font-weight:700;padding:11px 20px;border-radius:12px;box-shadow:0 3px 0 #5a3f0c;font-size:16px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5a3f0c}
.btn.sec{background:linear-gradient(#4a4060,#2e2840);color:var(--txt);box-shadow:0 3px 0 #1a1624}
.btn:disabled{opacity:.4}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(0,0,0,.4);font-size:14px;gap:6px}
.pill{background:rgba(255,255,255,.09);padding:4px 10px;border-radius:20px;font-size:14px}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:14px;gap:12px}
h1{font-size:32px;text-align:center;color:var(--gold);text-shadow:0 2px 10px #000}
h2{font-size:21px;text-align:center;color:var(--gold)}
.muted{opacity:.7;font-size:13px;text-align:center;line-height:1.5}
.box{background:rgba(0,0,0,.3);border-radius:12px;padding:12px;width:100%;line-height:1.6;font-size:14px}
.link-btn{text-decoration:underline;opacity:.8;font-size:13px}

/* ---------- การ์ด ---------- */
.card{--w:100px;--rc:#888;width:var(--w);height:calc(var(--w)*1.42);border-radius:calc(var(--w)*.1);background:linear-gradient(160deg,#352d44,#1a1622);border:2px solid var(--rc);position:relative;display:flex;flex-direction:column;padding:calc(var(--w)*.045);color:var(--txt);user-select:none;-webkit-user-select:none;touch-action:none;flex-shrink:0;font-size:calc(var(--w)*.1);transition:transform .15s,margin .15s;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.card.r-starter{--rc:#8a8a8a}
.card.r-common{--rc:#9fc0dd}
.card.r-uncommon{--rc:#b07cf0;box-shadow:0 0 10px rgba(176,124,240,.4)}
.card.r-rare{--rc:#f2c443;box-shadow:0 0 14px rgba(242,196,67,.65);background:linear-gradient(160deg,#4a3a20,#1f1810)}
.card .cost{position:absolute;top:calc(var(--w)*-.07);left:calc(var(--w)*-.07);width:calc(var(--w)*.28);height:calc(var(--w)*.28);border-radius:50%;background:radial-gradient(circle at 35% 35%,#7cc0ff,#1f4f9a);border:2px solid #f2d27a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--w)*.16);z-index:2}
.card .cname{text-align:center;font-weight:700;padding:2px 2px 2px calc(var(--w)*.14);border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--w)*.105)}
.t-atk .cname{background:#7a2a2a}.t-skill .cname{background:#2a547a}.t-power .cname{background:#5d3f82}
.card .art{flex:0 0 34%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--w)*.3);margin:3px 0;border-radius:6px;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(0,0,0,.25))}
.card .ctype{text-align:center;opacity:.7;font-size:calc(var(--w)*.08)}
.card .cdesc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.25;padding:1px}
.card .ex{font-size:calc(var(--w)*.08);color:#ffb38a;font-style:italic}
.card .dis{font-size:calc(var(--w)*.078);text-align:center;line-height:1.2;padding:2px 1px 0;border-top:1px dashed rgba(255,255,255,.2);color:#cfe3ff}
.card .dis.rec{color:#ffe27a}
.card .up{color:#7ef08a;font-weight:800}.card .down{color:#ff8a7a;font-weight:800}
.card.cant{filter:grayscale(.75) brightness(.7)}
.grid{display:flex;flex-wrap:wrap;gap:14px 12px;justify-content:center;padding:6px 0}
.grid .card{cursor:pointer}

/* ---------- ไพ่ทาโรต์ (อาร์คานา) ---------- */
.tarot{--ec:#888;width:108px;min-height:190px;border-radius:10px;background:linear-gradient(160deg,#2b2140,#15101f);border:2px solid #c9a24a;box-shadow:inset 0 0 0 3px #15101f,inset 0 0 0 4px rgba(201,162,74,.45),0 4px 12px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;padding:9px 6px;gap:2px;text-align:center;font-size:10.5px;cursor:pointer;color:var(--txt);flex-shrink:0}
.tarot.minor{border-color:#8fa3b8;box-shadow:inset 0 0 0 3px #15101f,inset 0 0 0 4px rgba(143,163,184,.4),0 4px 12px rgba(0,0,0,.5)}
.tarot .num{font-family:Georgia,serif;color:#e6c46a;font-size:13px;letter-spacing:1px}
.tarot .ticon{font-size:38px;margin:3px 0;filter:drop-shadow(0 0 8px var(--ec))}
.tarot.rev .ticon{transform:rotate(180deg)}
.tarot .en{font-family:Georgia,serif;font-size:10.5px;color:#e6c46a;line-height:1.2}
.tarot .th{font-weight:700;font-size:12px;line-height:1.25}
.tarot .el{font-size:9.5px;padding:1px 7px;border-radius:8px;background:var(--ec);color:#111;font-weight:700;margin-top:2px}
.tarot .td{line-height:1.3;margin-top:4px}
.tarot .bad{color:#ff8a7a;font-size:9.5px;line-height:1.3;margin-top:2px}
.tarot .revtag{color:#ff8a7a;font-weight:700;font-size:10px;margin-top:2px}
.tarot .syn{color:#7ef08a;font-size:9.5px;line-height:1.3;margin-top:2px}
.tarot.small{width:96px;min-height:0;font-size:9.5px;cursor:default}
.tarot.small .ticon{font-size:28px}
/* ภาพไพ่ (art/) — ถ้าไม่มีไฟล์ ใช้ไอคอนอีโมจิเดิม */
.tarot .ticon .tartimg{display:none}
.tarot .ticon.hasart{font-size:0;width:76px;height:104px;margin:4px auto;border-radius:6px;overflow:hidden;border:1px solid rgba(201,162,74,.75);filter:none;background:#0d0a16}
.tarot.small .ticon.hasart{width:64px;height:88px}
.tarot .ticon.hasart .tartimg{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 42%;transform:scale(1.46);transform-origin:50% 44%}
.tarot.f-anim .ticon.hasart .tartimg{animation:slowzoomc 7s ease-in-out infinite alternate}
@keyframes slowzoomc{from{transform:scale(1.46)}to{transform:scale(1.58)}}
@keyframes slowzoom{from{transform:scale(1)}to{transform:scale(1.09)}}
.artframe{position:relative;width:min(88vw,380px);aspect-ratio:2/3;border-radius:16px;overflow:hidden;border:3px solid #8a8a8a;background:#0d0a16;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.artframe .artfull{display:block;width:100%;height:100%;object-fit:cover}
.artframe.f-silver{border-color:#e3e8ee;box-shadow:0 0 22px rgba(227,232,238,.45)}
.artframe.f-gold,.artframe.f-alt,.artframe.f-anim{border-color:#ffd25a;box-shadow:0 0 28px rgba(255,210,90,.6)}
.artframe.f-gold::after,.artframe.f-alt::after,.artframe.f-anim::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 45%,rgba(160,220,255,.18) 55%,transparent 70%);background-size:250% 100%;animation:holo 3s linear infinite}
.artframe.f-anim .artfull{animation:slowzoom 7s ease-in-out infinite alternate}
.tarot{position:relative;overflow:hidden}
.tarot .lv{position:absolute;top:4px;right:6px;font-size:9px;color:#ffd25a;font-weight:700}
.tarot .formtag{font-size:9.5px;color:#9fd8ff;font-weight:700}
.tarot.none{filter:grayscale(1) brightness(.45)}
/* ระดับภาพไพ่ตามจำนวนที่สะสม */
.tarot.f-silver{border-color:#e3e8ee;box-shadow:inset 0 0 0 3px #15101f,inset 0 0 0 4px rgba(227,232,238,.6),0 0 10px rgba(227,232,238,.35)}
.tarot.f-gold,.tarot.f-alt,.tarot.f-anim{border-color:#ffd25a;box-shadow:inset 0 0 0 3px #15101f,inset 0 0 0 4px rgba(255,210,90,.6),0 0 16px rgba(255,210,90,.55)}
.tarot.f-gold::after,.tarot.f-alt::after,.tarot.f-anim::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.2) 45%,rgba(160,220,255,.16) 55%,transparent 70%);background-size:250% 100%;animation:holo 3s linear infinite}
@keyframes holo{from{background-position:150% 0}to{background-position:-100% 0}}
.tarot.f-alt,.tarot.f-anim{background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#ffe9a8,transparent),radial-gradient(1px 1px at 30% 80%,#fff,transparent),radial-gradient(circle at 50% 30%,#3b2a6e,#120c24 70%)}
.tarot.f-anim .ticon{animation:floaty 2.4s ease-in-out infinite}
.tarot.rev.f-anim .ticon{animation-name:floatyRev}
@keyframes floaty{50%{transform:translateY(-5px) scale(1.08)}}
@keyframes floatyRev{0%,100%{transform:rotate(180deg)}50%{transform:rotate(180deg) translateY(5px) scale(1.08)}}
.wallet{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.ctile{--ec:#888;aspect-ratio:3/4.2;border-radius:8px;background:linear-gradient(160deg,#2b2140,#15101f);border:2px solid #6a6a78;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:2px;position:relative;color:var(--txt)}
.ctile .ci{font-size:24px;filter:drop-shadow(0 0 6px var(--ec))}
.ctile.none{filter:grayscale(1) brightness(.35)}
.ctile .cnt{position:absolute;bottom:3px;right:5px;font-weight:700;color:var(--gold)}
.ctile .alt{position:absolute;top:3px;left:4px;font-size:10px}
.ctile.l2{border-color:#e3e8ee}
.ctile.l3{border-color:#ffd25a;box-shadow:0 0 8px rgba(255,210,90,.5)}
.ctile.l5,.ctile.l7{border-color:#ffd25a;box-shadow:0 0 8px rgba(255,210,90,.5);background:radial-gradient(circle at 50% 30%,#3b2a6e,#120c24 75%)}
.ctile.l7 .ci{animation:floaty 2.4s ease-in-out infinite}
.pullres{display:flex;flex-direction:column;align-items:center;gap:4px}
.door{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;background:linear-gradient(#3a2f52,#241d34);border:2px solid #6a5a8a;text-align:left;min-height:84px;color:var(--txt)}
.door:active{transform:scale(.98)}
.door.elite{border-color:#c0504a}.door.boss{border-color:#e6b422;box-shadow:0 0 16px rgba(230,180,34,.4)}.door.shop{border-color:#4caf7a}.door.rest{border-color:#ff9a4a}
.dart{font-size:42px;width:54px;text-align:center;flex-shrink:0}
.dinfo{flex:1;font-size:15px;line-height:1.4}.dinfo small{display:block;font-size:12px;opacity:.75;line-height:1.35}
.dgo{font-size:20px;opacity:.6}
.steps{display:flex;gap:8px;justify-content:center}
.step{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:14px}
.step.done{background:#3d7a4a}.step.cur{background:var(--gold);color:#1a1206;font-weight:700}
.trow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:2px solid transparent;text-align:left;color:var(--txt)}
.trow.sel{border-color:var(--gold);background:rgba(230,180,34,.14)}.trow.lock{opacity:.4}
.trow .tn{font-weight:700;width:44px;flex-shrink:0}.trow .tinfo{flex:1;font-size:14px}.trow .tinfo small{display:block;font-size:11px;opacity:.7}
.trow .texp{font-size:13px;text-align:right}.trow .texp small{display:block;font-size:10px;opacity:.7}
.expbar{height:14px;background:#1a1624;border-radius:7px;overflow:hidden;position:relative;margin:6px 0}
.expbar>i{display:block;height:100%;background:linear-gradient(#7ad0ff,#2f7ad0)}
.expbar>span{position:absolute;inset:0;font-size:10px;text-align:center;line-height:14px;font-weight:700}
.amu{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border-radius:12px;background:rgba(255,255,255,.05)}
.amu .ai2{font-size:28px;width:38px;text-align:center;flex-shrink:0}
.amu .ainfo{flex:1;min-width:0;font-size:12px;line-height:1.3}
.amu .ainfo small{display:block;opacity:.7;font-size:11px}
.tchips{display:flex;gap:4px;flex-shrink:0}
.tchip{--tc:#aaa;min-width:38px;padding:4px 2px;border-radius:8px;border:2px solid var(--tc);font-size:11px;font-weight:700;line-height:1.2;text-align:center;color:var(--tc);background:rgba(0,0,0,.35)}
.tchip small{display:block;font-size:10px;color:var(--txt);font-weight:400}
.tchip.zero{opacity:.35}
.tchip.on{background:var(--tc);color:#111}.tchip.on small{color:#111}
.tchip.t1{--tc:#b8b8c0}.tchip.t2{--tc:#5ab0ff}.tchip.t3{--tc:#b07cf0}.tchip.t4{--tc:#ffd25a}
.aslot{width:74px;height:74px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;color:rgba(255,255,255,.4);flex-shrink:0}
.aslot small{font-size:9px;line-height:1.1;text-align:center}
.aslot.filled{border:2px solid var(--tc);color:#fff;box-shadow:0 0 12px var(--tc);background:radial-gradient(circle,#2b2140,#120c24)}
.arow2{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.05);font-size:12px}
.arow2.cur{background:rgba(255,210,90,.15);border:1px solid #ffd25a}
.pullres .tag{font-size:11px;font-weight:700;text-align:center;line-height:1.3;max-width:100px}
.pullres .tarot{animation:pop .7s ease-out both}
.arcbar{display:flex;justify-content:center;align-items:center;gap:8px;padding:4px;background:rgba(0,0,0,.25);font-size:12px}
.arcbar .ai{font-size:18px;display:inline-block}
.arcbar .ai.rev{transform:rotate(180deg)}
.arow{--ec:#888;display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px;border-radius:10px;background:rgba(255,255,255,.04);border-left:3px solid var(--ec);font-size:12px;line-height:1.45;text-align:left}
.arow .ai{font-size:24px;width:32px;text-align:center;flex-shrink:0}
.arow small{opacity:.8}
.arow .bad{color:#ff8a7a}
.arow.cur{background:rgba(255,210,90,.15);border-left-color:#ffd25a}
button.arow{color:var(--txt);text-align:left}
.mjrow{display:flex;gap:12px;align-items:flex-start;width:100%}
.mjctl{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.pchips span{background:rgba(255,255,255,.08);padding:3px 8px;border-radius:10px}
.sect{width:100%;font-weight:700;color:var(--gold);margin-top:8px}
.chosen{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:13px;background:rgba(0,0,0,.3);padding:6px 12px;border-radius:12px}

/* ---------- ต่อสู้ ---------- */
.enemy-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;min-height:0}
.intent{background:rgba(0,0,0,.55);padding:5px 12px;border-radius:14px;font-size:15px;border:1px solid rgba(255,255,255,.15);text-align:center;line-height:1.35}
.intent .next{font-size:12px;opacity:.65}
.guide h3{color:var(--gold);font-size:16px;margin:12px 0 4px}
.guide{width:100%;font-size:14px;line-height:1.6}
.guide ul{padding-left:18px}
.guide .ex{background:rgba(255,255,255,.06);border-left:3px solid var(--gold);padding:6px 10px;border-radius:6px;font-size:13px;margin:6px 0}
.enemy-art{font-size:86px;line-height:1.1;filter:drop-shadow(0 6px 12px #000)}
.ename{font-weight:700;font-size:16px}
.ename small{color:#ff9a6a;font-weight:400}
.bar{width:210px;height:16px;background:#3a1010;border-radius:8px;overflow:hidden;position:relative;border:1px solid #000}
.bar>i{display:block;height:100%;background:linear-gradient(#e25555,#a42020);transition:width .3s}
.bar>span{position:absolute;inset:0;font-size:11px;text-align:center;line-height:15px;font-weight:700;text-shadow:0 1px 2px #000}
.statuses{display:flex;flex-wrap:wrap;gap:5px;font-size:12px;justify-content:center;min-height:20px}
.st{background:rgba(0,0,0,.5);padding:2px 7px;border-radius:10px}
.st.blk{background:#1f4f7a}
.player-zone{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(0,0,0,.35)}
.energy{width:54px;height:54px;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd76a,#c26a00);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#2a1600;border:3px solid #ffeab0;box-shadow:0 0 12px rgba(255,200,80,.5)}
.pinfo{flex:1;display:flex;flex-direction:column;gap:4px}
.pinfo .bar{width:100%}
.pinfo .statuses{justify-content:flex-start}
.hand{height:170px;display:flex;justify-content:center;align-items:flex-end;padding:0 8px 4px;flex-shrink:0}
.hand .card{--w:82px}
.hand .card.sel{transform:translateY(-46px) scale(1.45);z-index:20}
.hand .card.drag{z-index:30;transition:none}
.hint{display:flex;justify-content:center;align-items:center;gap:8px;font-size:12px;height:34px;padding:0 8px}
.hint .mini{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:5px 9px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.hint .mini.up{border-color:#e6b422}
.hint .tip{opacity:.6}
.hint .pillc{background:rgba(0,0,0,.45);padding:3px 8px;border-radius:9px}
.hint .pillc.full{color:#ff9a8a}
.st.trap{background:#2d3f5c}
.controls{display:flex;justify-content:space-between;align-items:center;padding:4px 12px 14px}
.pile{font-size:13px;background:rgba(0,0,0,.45);padding:7px 11px;border-radius:10px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.float{position:fixed;pointer-events:none;font-weight:800;font-size:22px;text-shadow:0 2px 4px #000,0 0 2px #000;animation:floatup 1s forwards;z-index:999;white-space:nowrap}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
.toast{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(120,20,20,.92);padding:10px 18px;border-radius:10px;z-index:500;font-weight:700;animation:fade 1.4s forwards;text-align:center;max-width:85%}
.toast.info{background:rgba(30,26,44,.96);border:1px solid rgba(255,255,255,.2);font-weight:400;line-height:1.5}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}

/* ---------- ไพ่ต่อสู้ (Minor 4 ใบ) ---------- */
.hand{height:auto;gap:6px;padding:4px 8px 6px;align-items:flex-end}
.kcard{--ec:#888;width:calc((min(100vw,480px) - 48px)/4);min-height:150px;border-radius:10px;background:linear-gradient(160deg,#352d44,#1a1622);border:2px solid var(--ec);position:relative;display:flex;flex-direction:column;align-items:center;padding:8px 4px 5px;color:var(--txt);user-select:none;-webkit-user-select:none;touch-action:none;flex-shrink:0;font-size:10.5px;transition:transform .15s;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.kcard .cost{position:absolute;top:-8px;left:-6px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7cc0ff,#1f4f9a);border:2px solid #f2d27a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;z-index:2}
.kcard .krole{position:absolute;top:2px;right:4px;font-size:13px}
.kcard .kname{font-weight:700;font-size:11.5px;text-align:center;margin:0 10px 0 14px;line-height:1.2}
.kcard .kart{font-size:26px;filter:drop-shadow(0 0 6px var(--ec));text-align:center;line-height:1;margin:3px 0}
.kcard .kart small{display:block;font-size:9px;color:#e6c46a;font-family:Georgia,serif;filter:none}
.kcard .kdesc{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;line-height:1.25;gap:2px}
.kcard .krev{color:#ff8a7a;font-size:9px}
.kcard.isrev .kart{transform:rotate(180deg)}
.kcard .kused{position:absolute;inset:0;background:rgba(0,0,0,.55);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#ccc}
.kcard.cant{filter:grayscale(.7) brightness(.75)}
.kcard.sel{transform:translateY(-34px) scale(1.25);z-index:20}
.kcard.drag{z-index:30;transition:none}
.kcard .up{color:#7ef08a;font-weight:800}.kcard .down{color:#ff8a7a;font-weight:800}
.controls{gap:10px}
.bar.brk{height:12px;background:#2b2410;margin-top:-2px}.bar.brk>i{background:linear-gradient(#e8c24a,#a07a10)}.bar.brk>span{font-size:9px;line-height:11px}
.st.wk{background:#4a3a14;color:#ffe9a8}
.kcard.wkhit{box-shadow:0 0 12px var(--ec),0 4px 10px rgba(0,0,0,.5)}
.kcard .kwk.bad{background:#7a3030;color:#ffd0d0}
.stains{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px}
.stains .sd{width:26px;height:26px;border-radius:50%;border:2px solid var(--ec);display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4)}
.stains .rx{background:rgba(255,210,90,.18);border:1px solid #e8c24a;border-radius:10px;padding:2px 8px;font-size:11px}
.kcard .kwk{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#e8c24a;color:#201400;font-size:9px;font-weight:700;border-radius:8px;padding:1px 6px;white-space:nowrap}
.basicbtn{background:rgba(0,0,0,.5);border:2px solid #9fc0dd;border-radius:12px;padding:5px 8px;font-size:18px;line-height:1.1;text-align:center;color:var(--txt)}
.basicbtn small{display:block;font-size:9px;opacity:.85}.basicbtn:disabled{opacity:.35}
.parry{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;touch-action:none;user-select:none}
.pr-box{position:relative;width:200px;height:200px}
.pr-target{position:absolute;inset:67px;border:5px solid #ffe27a;border-radius:50%;box-shadow:0 0 14px #ffe27a}
.pr-ring{position:absolute;inset:0;border:5px solid #fff;border-radius:50%;animation:prshrink var(--T) linear forwards}
@keyframes prshrink{from{transform:scale(1);opacity:.45}to{transform:scale(.33);opacity:1}}
.pr-txt{text-align:center;line-height:1.6;font-size:16px;text-shadow:0 2px 4px #000}
.ultbtn{--ec:#ffd25a;flex:1;position:relative;overflow:hidden;background:rgba(0,0,0,.5);border:2px solid var(--ec);border-radius:12px;padding:7px 10px;font-weight:700;font-size:13px;line-height:1.25;text-align:center;color:var(--txt)}
.ultbtn small{display:block;font-weight:400;font-size:11px;opacity:.85}
.ultbtn i{position:absolute;left:0;bottom:0;height:4px;background:var(--ec)}
.ultbtn.ready{background:linear-gradient(#5a4a10,#2e2508);box-shadow:0 0 14px var(--ec);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 24px var(--ec);transform:scale(1.03)}}
.kitslots{display:flex;gap:6px;width:100%;justify-content:center}
.kslot{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0}
.kslot .tarot.small{width:100%;min-height:0;cursor:pointer;padding:6px 2px;font-size:8.5px}
.kslot .tarot.small .ticon{font-size:20px}
.kempty{width:100%;min-height:120px;border:2px dashed rgba(255,255,255,.3);border-radius:10px;font-size:28px;color:rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center}
.kempty small{font-size:10px}

/* ---------- แผนที่ / ร้านค้า / โมดัล ---------- */
.map{display:flex;flex-direction:column;align-items:center;width:100%}
.node{display:flex;align-items:center;gap:10px;width:80%;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.35);font-size:15px}
.node .ic{font-size:24px}
.node.done{opacity:.4}
.node.cur{background:rgba(230,180,34,.2);border:2px solid var(--gold);box-shadow:0 0 12px rgba(230,180,34,.35)}
.node .ok{margin-left:auto}
.link{width:2px;height:12px;background:rgba(255,255,255,.2)}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:6px}
.shopitem.sold{opacity:.25;pointer-events:none}
.price{font-size:14px;font-weight:700;color:var(--gold)}
.svc{display:flex;gap:10px;width:100%}
.svc>button{flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px;line-height:1.5;font-size:14px}
.svc>button:disabled{opacity:.35}
.modal{position:absolute;inset:0;background:rgba(5,3,8,.94);display:flex;flex-direction:column;align-items:center;z-index:100;padding:14px;overflow-y:auto;gap:10px}
.modal .close{position:sticky;bottom:0}
.reveal .card{--w:160px;animation:pop .8s ease-out}
.reveal-t .tarot{animation:pop .8s ease-out}
@keyframes pop{0%{transform:scale(.2) rotateY(180deg);opacity:0}70%{transform:scale(1.12) rotateY(0)}100%{transform:scale(1)}}
.rlabel{font-size:22px;font-weight:800}
.choice{display:flex;flex-direction:column;gap:10px;width:100%}
.choice .btn{width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ================= ข้อมูลพื้นฐาน =================
const RAR = {starter:'พื้นฐาน', common:'ธรรมดา', uncommon:'หายาก', rare:'ตำนาน'};
const RCOLOR = {starter:'#aaa', common:'#9fc0dd', uncommon:'#b07cf0', rare:'#f2c443'};
let BASE_HP = 95;                                          // HP เริ่มต้นของอัศวิน (ปรับจาก 80 เพื่อชดเชยที่ Minor ถูกปรับสมดุลให้อ่อนลง)
const MAXE = 5, REV_AT = 4, ULT_MAX = 10, KIT_SLOTS = 4, REV_K = 1.4;      // REV_AT = จำนวนไพ่ซ้ำที่ปลดล็อกการกลับหัว · REV_K = ไพ่กลับหัวแรงขึ้น ×1.4
let REGEN = 3;   // พลังงานที่ฟื้นทุกต้นเทิร์น

let screen = 'title', G = null, C = null, E = null, uidN = 0;

// ================= ตัวคำนวณ (รวมผลของไพ่อาร์คานาใน G.mods) =================
const shown = (d, n) => d > n ? `<span class="up">${d}</span>` : d < n ? `<span class="down">${d}</span>` : d;
function calcDmg(n, mult = 1) {
  const m = G.mods;
  let d = n + (C.str + C.strT) * mult;
  if (C.atkCount === 0) d += m.firstAtk;
  d += m.allAtk;
  d *= 1 + m.dmgPct;
  if (C.played === 1) d *= 1 + m.secondMult;
  d = Math.floor(d);
  if (E.vuln > 0) d = Math.floor(d * (1.5 + m.vulnBonus));
  if (C.curEl) d = Math.floor(d * (C.curEl === E.wk ? WEAK_K : C.curEl === E.res ? RES_K : 1));   // ธาตุชนะ ×1.5 · ธาตุแพ้ ×0.75
  if (C.boost) d = Math.floor(d * 1.25);                                // ตราธาตุเดียวกัน 2 ดวง
  if (E.stun > 0) d = Math.floor(d * STUN_K);                          // ศัตรูมึน
  return Math.max(0, d);
}
function blockAmt(n) {
  const m = G.mods;
  n = (n + m.blockFlat) * (1 + m.blockPct);
  if (C && C.played === 1) n *= 1 + m.secondMult;
  return Math.max(0, Math.floor(n));
}
// ตัวเลขบนการ์ด: เขียว = สูงขึ้น แดง = ต่ำลง
const D = (n, mult = 1) => C && E ? shown(calcDmg(n, mult), n) : n;
const B = n => C ? shown(blockAmt(n), n) : n;

// ================= ฟังก์ชันที่การ์ดเรียกใช้ =================
function atk(n, mult = 1) { return hurtEnemy(calcDmg(n, mult)); }
function hurtEnemy(d) {
  if (E.hp <= 0) return 0;
  const b = Math.min(E.block, d);
  E.block -= b; d -= b;
  E.hp = Math.max(0, E.hp - d);
  fx('enemy', d > 0 ? `-${d}` : 'ป้องกัน', d > 0 ? '#ff6b6b' : '#9fc0dd');
  if (d > 0) C.shakeE = true;
  return d;
}
function block(n) {
  if (n <= 0) return;
  n = blockAmt(n);
  C.block += n;
  fx('player', `+${n} 🛡`, '#8fd0ff');
}
function applyE(k, n) {
  E[k] += n;
  fx('enemy', (k === 'vuln' ? '🎯 เปราะบาง +' : '🥀 อ่อนแรง +') + n, '#e0b0ff');
}
function heal(n) {
  const h = Math.min(n, G.maxHp - G.hp);
  G.hp += h;
  fx('player', `+${h} ❤`, '#7ef08a');
}
// ================= ไพ่อาร์คานา (Major 22 + Minor 56) =================
const pct = v => Math.round(v * 100) + '%';
const EL = {
  fire:  {th:'ไฟ', c:'#ff8a50', ic:'🔥'},
  water: {th:'น้ำ', c:'#5ab0ff', ic:'💧'},
  air:   {th:'ลม', c:'#cfe8ff', ic:'🌪️'},
  earth: {th:'ดิน', c:'#86d17a', ic:'🌿'},
};
// ข้อเสียเมื่อไพ่ออกมา "กลับหัว"
const BAD = {
  hp:     {d:'HP สูงสุด −8', f:m=>m.maxHp-=8},
  ehp:    {d:'ศัตรู HP +8%', f:m=>m.enemyHpPct+=.08},
  estr:   {d:'ศัตรูเริ่มการต่อสู้ได้เกราะ 8', f:m=>m.enemyBlock+=8},
  shop:   {d:'ราคาร้านค้า +30%', f:m=>m.shopPct+=.3},
  nogold: {d:'เริ่มรอบไม่มีทอง', f:m=>m.goldStart-=999},
  e1:     {d:'เริ่มการต่อสู้เกจ −1', f:m=>m.startGauge-=1},
  d1:     {d:'ไพ่ใบแรกของการต่อสู้เสียพลังงาน +1', f:m=>m.firstExtra+=1},
  blk:    {d:'เกราะ −20%', f:m=>m.blockPct-=.2},
  dmg:    {d:'ดาเมจ −10%', f:m=>m.dmgPct-=.1},
  rew:    {d:'ผงดาวจากรางวัล −25%', f:m=>m.dustMult-=.25},
  rest:   {d:'กองไฟฟื้น HP แค่ครึ่งเดียว', f:m=>m.restMult*=.5},
  drain:  {d:'เสีย HP เพิ่มอีก 1 ทุกเทิร์น', f:m=>m.drain+=1},
};
// ข้อเสียตอนกลับหัวของ Minor (ไพ่รอง) เบากว่า Major ครึ่งหนึ่ง
const BADM = {
  hp:  {d:'HP สูงสุด −4', f:m=>m.maxHp-=4},
  ehp: {d:'ศัตรู HP +4%', f:m=>m.enemyHpPct+=.04},
  blk: {d:'ศัตรู HP +5%', f:m=>m.enemyHpPct+=.05},       // (เดิมเกราะ −10% / ดาเมจ −5% ถูกปัดทิ้งทีละ 1 ต่อครั้ง ทำให้โหดเกินจริง)
  dmg: {d:'HP สูงสุด −5', f:m=>m.maxHp-=5},
};
const badOf = A => (A.major ? BAD : BADM)[A.bad];
const MAJORS = [
  {no:'0',    en:'The Fool',          th:'คนเขลา',        el:'air',   icon:'🤹', v:1,   rv:2,   bad:'nogold', d:v=>`ไพ่ ${v} ใบแรกของการต่อสู้ไม่เสียพลังงาน · เริ่มรอบได้ทอง +30 · เริ่มการต่อสู้เกราะ 10`, f:(m,v)=>{m.freeCards+=v; m.goldStart+=30; m.startBlock+=10;}},
  {no:'I',    en:'The Magician',      th:'นักเวท',        el:'air',   icon:'🎩', v:1,   rv:2,   bad:'hp',     d:v=>`เกจพลังงานสูงสุด +${v} · เริ่มการต่อสู้เกราะ 5`, f:(m,v)=>{m.maxGauge+=v; m.startBlock+=5;}},
  {no:'II',   en:'The High Priestess',th:'นักบวชหญิง',    el:'water', icon:'📿', v:1,   rv:2,   bad:'estr',   d:v=>`ชาร์จพลังพิเศษ +${v} ทุกต้นเทิร์น`, f:(m,v)=>m.turnCharge+=v},
  {no:'III',  en:'The Empress',       th:'จักรพรรดินี',    el:'earth', icon:'👑', v:8,   rv:12,  bad:'shop',   d:v=>`ฟื้น HP ${v} หลังชนะ`, f:(m,v)=>m.healWin+=v},
  {no:'IV',   en:'The Emperor',       th:'จักรพรรดิ',      el:'earth', icon:'🏛️', v:10,  rv:16,  bad:'e1',     d:v=>`เริ่มการต่อสู้ได้เกราะ ${v}`, f:(m,v)=>m.startBlock+=v},
  {no:'V',    en:'The Hierophant',    th:'ผู้นำศาสนา',     el:'water', icon:'⛪', v:2,   rv:3,   bad:'hp',     d:v=>`หลอดพลังพิเศษสูงสุด −${v} (เต็มเร็วขึ้น)`, f:(m,v)=>m.ultCut+=v},
  {no:'VI',   en:'The Lovers',        th:'คู่รัก',         el:'water', icon:'💞', v:.3,  rv:.5,  bad:'rew',    d:v=>`ไพ่ใบที่ 2 ของทุกเทิร์น ผล ×${1+v}`, f:(m,v)=>m.secondMult+=v},
  {no:'VII',  en:'The Chariot',       th:'ราชรถ',         el:'fire',  icon:'🏇', v:3,   rv:6,   bad:'blk',    d:v=>`การ์ดโจมตีใบแรกของเทิร์น ดาเมจ +${v}`, f:(m,v)=>m.firstAtk+=v},
  {no:'VIII', en:'Strength',          th:'พลังแห่งใจ',     el:'fire',  icon:'🦁', v:2,   rv:3,   bad:'ehp',    d:v=>`เริ่มการต่อสู้ได้พลัง +${v}`, f:(m,v)=>m.startStr+=v},
  {no:'IX',   en:'The Hermit',        th:'ฤาษี',          el:'earth', icon:'🏮', v:1,   rv:2,   bad:'rest',   d:v=>`เทิร์นที่ใช้ไพ่ไม่เกิน 1 ใบ: จบเทิร์นแล้วได้พลังงาน +${v} และชาร์จพลังพิเศษ +2`, f:(m,v)=>m.patient=Math.max(m.patient,v)},
  {no:'X',    en:'Wheel of Fortune',  th:'กงล้อแห่งโชคชะตา', el:'earth', icon:'🎡', v:20,  rv:40,  bad:'shop',   d:v=>`ผงดาวจากรางวัล +${v}% · ทองจากการต่อสู้ +30% · เริ่มรอบได้ทอง +40 · ฟื้น HP 3 หลังชนะ · เริ่มการต่อสู้เกราะ 6`, f:(m,v)=>{m.dustMult+=v/100; m.goldMult+=.3; m.goldStart+=40; m.healWin+=3; m.startBlock+=6;}},
  {no:'XI',   en:'Justice',           th:'ความยุติธรรม',   el:'air',   icon:'⚖️', v:.2,  rv:.35, bad:'estr',   d:v=>`ถูกโจมตี สะท้อนดาเมจกลับ ${pct(v)}`, f:(m,v)=>m.reflect+=v},
  {no:'XII',  en:'The Hanged Man',    th:'คนแขวน',        el:'water', icon:'🙃', v:1,   rv:2,   bad:'d1',     d:v=>`ไพ่ใบแรกของ <b>เทิร์นคู่</b> ลดค่าพลังงาน ${v}`, f:(m,v)=>m.evenFirstDisc+=v},
  {no:'XIII', en:'Death',             th:'ความตาย',       el:'fire',  icon:'💀', v:25,  rv:40,  bad:'hp',     d:v=>`ชนะการต่อสู้ได้ทอง +${v} · ดาเมจ +10%`, f:(m,v)=>{m.killGold+=v; m.dmgPct+=.1;}},
  {no:'XIV',  en:'Temperance',        th:'ความพอดี',      el:'water', icon:'⚗️', v:20,  rv:16,  bad:'dmg',    d:v=>`ไม่รับดาเมจเกิน ${v} ต่อการโจมตีหนึ่งครั้ง · เกราะ +15%`, f:(m,v)=>{m.dmgCap=m.dmgCap?Math.min(m.dmgCap,v):v; m.blockPct+=.15;}},
  {no:'XV',   en:'The Devil',         th:'ปีศาจ',         el:'fire',  icon:'😈', v:.4,  rv:.6,  bad:'drain',  d:v=>`ดาเมจ +${pct(v)} · เสีย HP 2 ทุกเทิร์น`, f:(m,v)=>{m.dmgPct+=v; m.drain+=2;}},
  {no:'XVI',  en:'The Tower',         th:'หอคอย',         el:'fire',  icon:'🗼', v:12,  rv:20,  bad:'blk',    d:v=>`เริ่มการต่อสู้ ศัตรูโดนดาเมจ ${v}`, f:(m,v)=>m.startEnemyDmg+=v},
  {no:'XVII', en:'The Star',          th:'ดวงดาว',        el:'air',   icon:'⭐', v:15,  rv:25,  bad:'ehp',    d:v=>`HP ต่ำกว่า 30% ครั้งแรกของการต่อสู้: ฟื้น ${v}`, f:(m,v)=>m.starHeal+=v},
  {no:'XVIII',en:'The Moon',          th:'ดวงจันทร์',      el:'water', icon:'🌕', v:2,   rv:3,   bad:'d1',     d:v=>`ศัตรูเริ่มการต่อสู้ด้วยอ่อนแรง ${v}`, f:(m,v)=>m.startEnemyWeak+=v},
  {no:'XIX',  en:'The Sun',           th:'ดวงอาทิตย์',     el:'fire',  icon:'☀️', v:1,   rv:2,   bad:'hp',     d:v=>`ทุก 6 เทิร์น เกจเต็ม และชาร์จพลังพิเศษ +${v * 3}`, f:(m,v)=>{m.sunFull=true; m.sunCharge+=v * 3;}},
  {no:'XX',   en:'Judgement',         th:'การพิพากษา',     el:'air',   icon:'📯', v:.3,  rv:.5,  bad:'estr',   d:v=>`ตายครั้งแรกในรอบ: ฟื้นคืนด้วย HP ${pct(v)}`, f:(m,v)=>m.revive=Math.max(m.revive,v)},
  {no:'XXI',  en:'The World',         th:'โลก',           el:'earth', icon:'🌍', v:.4, rv:.6,  bad:'ehp',    d:v=>`ผลของไพ่ Minor ทั้ง 4 ใบ ×${1+v}`, f:()=>{}},
].map((M, i) => ({...M, id:'M' + i, major:true}));
const WORLD = 'M21';

// Minor 56 ใบ = ไพ่ต่อสู้ (ติดตั้ง 4 ใบ) · แต่ละชุดมีครบ 4 หน้าที่: ⚔️ โจมตี · 🛡️ ป้องกัน · ✨ บัฟ · 🌀 พิเศษ
// เลขสูง = แรงขึ้น และเสียพลังงานมากขึ้น (เลข 1–4 = ⚡1 · 5–8 = ⚡2 · 9–10 = ⚡3 · ราชสำนัก = ⚡2) · ใช้ได้ใบละ 1 ครั้งต่อเทิร์น
const ROLE = {atk:{ic:'⚔️', th:'โจมตี'}, def:{ic:'🛡️', th:'ป้องกัน'}, buf:{ic:'✨', th:'บัฟ'}, spc:{ic:'🌀', th:'พิเศษ'}};
const SUITS = {
  wands:     {en:'Wands', th:'ไม้เท้า', icon:'🪄', el:'fire',  bad:'blk', style:'ดาเมจแรง · ป้องกันแบบสวนกลับ · บัฟพลัง'},

const sc = (n, k) => Math.max(1, Math.round(n * k * KIT_POWER));
function opText(op, k, rev) {
  const [t, a, b] = op, n = sc(a || 0, k), st = (a || 0) + (rev ? 1 : 0);
  switch (t) {
    case 'atk': return b > 1 ? `ดาเมจ ${D(n)} ×${b}` : `ดาเมจ ${D(n)}`;
    case 'atkdrain': return `ดาเมจ ${D(n)} · ฟื้น HP ครึ่งหนึ่งของที่ทำได้`;
    case 'atkblk': return `ดาเมจเท่าเกราะที่มี (อย่างน้อย ${D(n)})`;
    case 'blk': return `เกราะ ${B(n)}`;
    case 'heal': return `ฟื้น HP ${n}`;
    case 'vuln': return `เปราะบาง ${st}`;
    case 'weak': return `อ่อนแรง ${st}`;
    case 'strT': return `พลัง +${n} (เทิร์นนี้)`;
    case 'refl': return `สะท้อนดาเมจ ${n} เมื่อถูกโจมตี (เทิร์นนี้)`;
    case 'gain': return `พลังงาน +${st}`;
    case 'unblk': return `ทำลายเกราะศัตรู`;
    case 'blkpct': return `เกราะ +${a}% ของที่มี`;
    case 'dust': return `ผงดาว +${st} (ครั้งแรกของการต่อสู้)`;

}
const kitDesc = (A, rev, mult = 1, sep = ' · ') => A.ops.map(op => opText(op, mult * (rev ? REV_K : 1), rev)).join(sep);
function runOps(ops, k, rev, cid) {
  ops.forEach(([t, a, b]) => {
    const n = sc(a || 0, k), st = (a || 0) + (rev ? 1 : 0);
    if (t === 'atk') for (let i = 0; i < (b || 1); i++) atk(n);
    else if (t === 'atkdrain') { const d = atk(n); if (d > 0) heal(Math.max(1, Math.floor(d / 2))); }
    else if (t === 'atkblk') atk(Math.max(n, C.block));
    else if (t === 'blk') block(n);
    else if (t === 'heal') heal(n);
    else if (t === 'vuln') applyE('vuln', st);
    else if (t === 'weak') applyE('weak', st);
    else if (t === 'strT') { C.strT += n; fx('player', `💪 +${n}`, '#ffb347'); }
    else if (t === 'refl') { C.reflectT += n; fx('player', `⛓️ ${n}`, '#cfe3ff'); }
    else if (t === 'gain') gainE(st);
    else if (t === 'unblk') { E.block = 0; fx('enemy', '🛡 แตก', '#ffd25a'); }
    else if (t === 'blkpct') { const x = Math.floor(C.block * a / 100); if (x > 0) { C.block += x; fx('player', `+${x} 🛡`, '#8fd0ff'); } }
    else if (t === 'dust') { if (!C.dustDone[cid]) { C.dustDone[cid] = 1; SAVE.dust += st; G.dustGot += st; persist(); fx('player', `✨ +${st}`, '#c9b6ff'); } }
  });
}

// ค่าผลจริงของไพ่ (กลับหัว = ค่า rv, แล้วคูณตัวคูณของ Minor)
function arcValue(A, rev, mult = 1) {
  const x = (rev ? A.rv : A.v) * mult;
  // ปัดขึ้นเพื่อให้โบนัสเห็นผลเสมอ (เช่น 1 × 1.25 → 2)
  return Number.isInteger(A.v) ? Math.ceil(x - 1e-9) : Math.round(x * 100) / 100;

  if (ARC[e.id].el === ARC[major.id].el) k *= 1.25;
  return k;
}

}

// ตัวคูณ EXP ของรอบนี้: ผ่านครั้งแรก 100% · เล่นซ้ำ 50% · ลดอีกตามเลเวลที่เกินที่แนะนำ
const lvPenalty = (lv, t) => Math.max(0.1, 1 - OVER_LV_PENALTY * Math.max(0, lv - recLevel(t)));
const expMult = (first, lv, t) => (first ? 1 : REPLAY_EXP) * lvPenalty(lv, t);
function addExp(n) {
  const h = SAVE.hero; let ups = 0;
  h.exp += n;
  while (h.level < LV_MAX && h.exp >= expNeed(h.level)) { h.exp -= expNeed(h.level); h.level++; h.points += PTS_PER_LV; ups++; }
  if (h.level >= LV_MAX) h.exp = 0;

}

const DOOR_POOL = {1:['slime', 'goblin', 'skeleton'], 2:['goblin', 'skeleton', 'orc'], 3:['goblin', 'skeleton', 'orc']};
const DOOR_W = [{k:'fight', w:4}, {k:'elite', w:2}, {k:'shop', w:2}, {k:'rest', w:2}];
const REST_GUARANTEE = {tiers:1};                       // ชั้น ≤ ค่านี้: ด่าน 3 (ก่อนบอส) มีกองไฟทุกครั้ง
function genDoors(stage, tier = 99) {
  if (stage >= STAGES) return [{t:'boss', eid:'dragon'}];
  const pool = DOOR_POOL[stage];
  if (stage === 1) return shuffle(pool).slice(0, 3).map(eid => ({t:'fight', eid}));   // ด่านแรกต่อสู้ทั้งหมด ได้การ์ดแน่นอน
  for (;;) {
    const types = [0, 1, 2].map(() => weighted(DOOR_W).k);
    const n = k => types.filter(x => x === k).length;
    if (n('shop') > 1 || n('rest') > 1 || n('elite') > 1 || n('fight') + n('elite') < 1) continue;   // กันโชคร้าย
    if (stage === STAGES - 1 && tier <= REST_GUARANTEE.tiers && n('rest') < 1) continue;            // ก่อนบอสต้องมีกองไฟ
    const ens = shuffle(pool); let ei = 0;
    return types.map(t => t === 'fight' ? {t, eid:ens[ei++ % ens.length]} : t === 'elite' ? {t, eid:'darkknight'} : {t});
  }
}

function weighted(list) { let r = Math.random() * list.reduce((s, x) => s + x.w, 0); for (const x of list) if ((r -= x.w) < 0) return x; return list[list.length - 1]; }

function grant(id) {
  const A = ARC[id], before = SAVE.owned[id] || 0;
  if (before >= MAX_COPIES) { const d = DUST[tierOf(A)]; SAVE.dust += d; return {id, before, dust:d}; }
  SAVE.owned[id] = before + 1;
  return {id, before};

function rollArc(forceMajor) {
  SAVE.pity++;
  const majorChance = RATES.major + Math.max(0, SAVE.pity - 29) * 5;     // ซอฟต์ pity ตั้งแต่ครั้งที่ 30
  let tier;
  if (forceMajor || SAVE.pity >= 50 || Math.random() * 100 < majorChance) tier = 'major';
  else {
    const r = Math.random() * (100 - RATES.major);
    tier = r < RATES.court ? 'court' : r < RATES.court + RATES.high ? 'high' : 'low';
  }
  if (tier === 'major') { SAVE.pity = 0; return grant(pick(MAJORS).id); }
  return grant(pick(MINORS.filter(n => tier === 'court' ? n.court : !n.court && (tier === 'high' ? n.rank >= 6 : n.rank <= 5))).id);
}

  else { if (SAVE.gems < n * PULL_COST) return toast('เพชรไม่พอ'); SAVE.gems -= n * PULL_COST; }

  for (let i = 0; i < n; i++) res.push(rollArc(n === 10 && i === 9 && !res.some(r => ARC[r.id].major)));
  persist(); render();
  const order = {major:0, court:1, pip:2};
  res.sort((a, b) => order[tierOf(ARC[a.id])] - order[tierOf(ARC[b.id])]);

const enemyDmg = base => Math.floor((base + E.str) * (E.weak > 0 ? .75 : 1) * matchK());
// ปัด/หลบตามจังหวะ: วงแหวนหดเข้ากรอบ แตะตอนตรงกรอบ · ปิดได้ที่หน้าแรก (ปุ่ม 🛡 ตั้งรับใช้ได้เสมอ)
const PARRY = {T:1200, perfect:150, good:340};

function toggleParry() { SAVE.parry = !parryOn(); persist(); render(); }
function startParry(it, done) {
  const ov = document.createElement('div');
  ov.className = 'parry'; ov.style.setProperty('--T', PARRY.T + 'ms');
  ov.innerHTML = `<div class="pr-box"><div class="pr-target"></div><div class="pr-ring"></div></div>
    <div class="pr-txt">${E.name} โจมตี ${intentParts(it, E.str, E.weak)}<br><b>แตะเมื่อวงแหวนตรงกรอบ!</b></div>`;
  app.appendChild(ov);

  const end = grade => { if (fin) return; fin = true; ov.remove(); done(grade); };
  ov.onpointerdown = () => { const e = Math.abs(Date.now() - t0 - PARRY.T); end(e <= PARRY.perfect ? 'perfect' : e <= PARRY.good ? 'good' : 'miss'); };
  setTimeout(() => end('miss'), PARRY.T + PARRY.good + 80);
}
function guard() {                                         // ตั้งรับ: ไม่ต้องจับจังหวะ ลดดาเมจเทิร์นนี้ครึ่งหนึ่ง แลกพลังงาน 1

function enemyTurn() {

    if (m.reflect) hurtEnemy(Math.floor(d * m.reflect));
    const b = Math.min(C.block, d); C.block -= b; d -= b;

function intentParts(it, str, weak) {
  const parts = [];

  if (it.block) parts.push(`🛡️ เกราะ ${it.block}`);

}

const DUSTV = {fight:6, elite:15, boss:35};                    // ผงดาวต่อด่าน (ชั้น 1) · +15% ต่อชั้น

  G.gold += gold;
  const dust = Math.ceil(DUSTV[n.t] * (1 + 0.15 * (G.tier - 1)) * Math.max(0, 1 + m.dustMult) - 1e-9);

    <h3>🧙 เลเวลและสถานะ</h3>
    <ul><li>ผ่านด่านได้ <b>EXP</b> (ต่อสู้ 10 · ศัตรูพิเศษ 25 · บอส 50 · ชั้นสูงได้เพิ่ม) แพ้ก็ยังได้ EXP จากด่านที่ผ่านมาแล้ว</li>
    <li>ขึ้นเลเวลได้ <b>2 แต้ม</b> นำไปอัป ❤ ความอึด · 💪 กำลัง · 🛡 ความแกร่ง · 🧠 ปัญญา · 🍀 โชค (ตัวละไม่เกิน 15 แต้ม) เลเวลสูงสุด 30</li>
    <li>แต่ละชั้นมี <b>เลเวลที่แนะนำ</b> ถ้าไม่ไหว กลับไปเล่นชั้นที่ผ่านแล้วเพื่อฟาร์มได้ แต่ได้ EXP <b>50%</b> และลดลงอีกถ้าเลเวลสูงกว่าที่แนะนำ</li>
    <li>รีเซ็ตแต้มได้ในราคา 🪙 เหรียญ</li></ul>

    <h3>🔮 ไพ่อาร์คานา</h3>
    <ul><li><b>Major</b> = อาชีพของคุณ สวมใส่ 1 ใบที่หน้า 🧙 ตัวละคร ให้พลังติดตัวตลอดรอบ และ <b>ท่าไม้ตาย 🌟</b> ตามธาตุ</li>
    <li><b>Minor 4 ใบ</b> = ไพ่ต่อสู้ของคุณ ติดตั้ง 4 ช่อง (ใบไหนก็ได้ที่มี ไม่ซ้ำกัน) ไม่มีสำรับ ไม่มีจั่ว ทุกใบอยู่ในมือทุกเทิร์น</li>
    <li>Minor ทุกชุดมี 4 หน้าที่: ⚔️ <b>โจมตี</b> · 🛡️ <b>ป้องกัน</b> · ✨ <b>บัฟ</b> · 🌀 <b>พิเศษ</b> ไพ่เลขสูงแรงกว่าแต่เสียพลังงานมากกว่า</li>
    <li>🪄 ไม้เท้า(ไฟ) ดาเมจแรง · 🏆 ถ้วย(น้ำ) ดูดเลือด/ฟื้นฟู · 🗡️ ดาบ(ลม) ฟันหลายครั้ง/เติมเกจ · 🪙 เหรียญ(ดิน) เกราะหนา/ทุบเกราะ</li>
    <li>Minor ที่ <b>ธาตุเดียวกับ Major</b> ได้ผล +25%</li>
    <li><b>ไพ่กลับหัว 🔻</b> แรงขึ้น ×1.4 แต่มีข้อเสีย ⚠ ใช้ได้เฉพาะไพ่ที่ <b>มีครบ 4 ใบ</b> สลับได้ที่หน้า 🧙 ตัวละคร</li>
    <li>ไพ่ซ้ำช่วยปลุกพลังภาพไพ่ ปลดล็อกร่างที่สองของ Major (3 ใบ) และการกลับหัว (4 ใบ)</li></ul>

    <h3>⚡ เกจพลังงาน</h3>
    <ul><li>สูงสุด 5 · เริ่มการต่อสู้เต็ม · <b>ฟื้น +3 ทุกต้นเทิร์น</b> พลังงานที่ไม่ได้ใช้ <b>เก็บไว้เทิร์นหน้าได้</b></li>
    <li>ตัวเลขมุมซ้ายบนของไพ่ = พลังงานที่ต้องจ่าย</li></ul>

    <h3>🃏 การใช้ไพ่</h3>
    <ul><li><b>แตะไพ่ 2 ครั้ง</b> หรือ <b>ลากขึ้น ▲</b> = ใช้ไพ่</li>

    <li>ไม่มีการทิ้งไพ่ — เป็นเรื่องของการ <b>บริหารพลังงาน</b> ว่าจะใช้ใบไหนก่อน ใบไหนเก็บพลังงานไว้ให้เทิร์นหน้า</li>
    <li>ตัวเลข <span style="color:#7ef08a">สีเขียว</span> = สูงกว่าค่าปกติ (มีโบนัส) · <span style="color:#ff8a7a">สีแดง</span> = ต่ำกว่า</li></ul>

    <h3>🔄 วงจรธาตุ</h3>
    <ul><li><b>💧 น้ำ ชนะ 🔥 ไฟ ชนะ 🌿 ดิน ชนะ 🌪️ ลม ชนะ 💧 น้ำ</b></li>
    <li>ศัตรูแต่ละตัวมี <b>ธาตุประจำตัว</b> (เปลี่ยนตามชั้น) ไพ่ธาตุที่ <b>ชนะ</b> ธาตุศัตรู = ดาเมจ ×1.5 (🎯 อ่อนต่อ) · ไพ่ธาตุที่ <b>แพ้</b> = ×0.75 · ดูป้ายใต้การ์ด</li>

    <h3>🧪 ตราธาตุ</h3>
    <ul><li>ทุกครั้งที่ใช้ไพ่ ศัตรูได้ <b>ตราธาตุ</b> ของไพ่นั้น (เก็บได้ 2 ดวง ดวงใหม่ดันดวงเก่าออก)</li>
    <li>ตรา 2 ดวง <b>ต่างธาตุ</b> = ปฏิกิริยา เกิดตอนใช้ไพ่ใบถัดไป: ♨️ น้ำ+ไฟ Break +4 · 💥 ไฟ+ลม ดาเมจ 12 · 🌋 ไฟ+ดิน เปราะบาง 2 · 🧊 น้ำ+ลม อ่อนแรง 2 · 🟤 น้ำ+ดิน เกราะ 10 · 🏜️ ลม+ดิน พลังงาน +1</li>

    <h3>💢 Break และโจมตีพื้นฐาน</h3>
    <ul><li>ไพ่ ⚔️ โจมตี และ 🌀 พิเศษ เติมหลอด <b>💢 Break</b> (+2 · ชนะธาตุศัตรู +3) เต็มแล้วศัตรู <b>😵 มึน</b> ข้ามเทิร์นถัดไป และรับดาเมจ ×1.3 ทันที</li>
    <li><b>👊 โจมตีพื้นฐาน</b> ฟรี ดาเมจเล็ก ได้พลังงาน +1 ใช้ได้ 1 ครั้งต่อเทิร์น</li></ul>

    <h3>🎯 ปัดตามจังหวะและตั้งรับ</h3>
    <ul><li>ก่อนศัตรูโจมตี จะมี <b>วงแหวนหดเข้ากรอบ</b> แตะหน้าจอตอนวงแหวนตรงกรอบ</li>

    <li>ไม่ถนัดจับจังหวะ ปิดได้ที่หน้าแรก (🎯 ปัดตามจังหวะ) หรือใช้ปุ่ม <b>🛡 ตั้งรับ</b> (เสีย 1⚡ ลดดาเมจเทิร์นนั้น 50% ไม่ต้องจับจังหวะ ใช้ได้ทั้งตอนเปิด/ปิดโหมดปัด)</li></ul>

    <h3>🌟 พลังพิเศษและท่าไม้ตาย</h3>
    <ul><li>ทุกครั้งที่ใช้ไพ่ หลอดพลังพิเศษชาร์จ +1 · ถ้าเป็นไพ่ <b>ธาตุเดียวกับ Major</b> ชาร์จ +2 · หลอดเต็มที่ 10</li>
    <li>เต็มแล้วกดปุ่ม 🌟 ใช้ <b>ท่าไม้ตาย</b> ได้ทุกเมื่อ ไม่เสียพลังงาน แล้วหลอดเริ่มใหม่</li>
    <li>🔥 ไฟ: ดาเมจใหญ่ + เปราะบาง · 💧 น้ำ: ฟื้น HP + เกราะ · 🌪️ ลม: ไพ่ทุกใบกลับมาใช้ได้อีกครั้ง + พลังงาน · 🌿 ดิน: เกราะหนา + สะท้อนดาเมจ</li></ul>

    <h3>👁️ อ่านท่าศัตรู (สำคัญมาก)</h3>

    <ul><li><b>ตอนนี้</b> = สิ่งที่ศัตรูจะทำหลังคุณจบเทิร์นนี้</li>
    <li><b>ถัดไป</b> = ท่าในเทิร์นต่อไป (คำนวณพลังที่มันกำลังจะได้รวมไว้แล้ว)</li></ul>

    <li>🛡️ เกราะ 12 = ศัตรูได้เกราะ ต้องตีทะลุก่อนถึง HP</li>
    <li>💪 พลัง +2 = ทุกการโจมตีหลังจากนี้แรงขึ้น +2 <b>ถาวร</b></li></ul>
    <div class="ex">ตัวอย่าง: ตอนนี้ "💪 พลัง +2" ถัดไป "🗡️ 20"<br>
    → เทิร์นนี้ศัตรูไม่ตี ใช้ไพ่โจมตีเต็มที่<br>
    → เก็บพลังงานไว้ใช้ไพ่ป้องกันรับ 20 ในเทิร์นหน้า</div>

    <h3>📋 สถานะ</h3>
    <ul><li>🛡 <b>เกราะ</b> กันดาเมจ · หายเมื่อเริ่มเทิร์นของคุณ</li>
    <li>💪 <b>พลัง</b> เพิ่มดาเมจทุกการโจมตี (ไพ่บัฟให้พลังชั่วคราวเฉพาะเทิร์นนั้น)</li>
    <li>🎯 <b>เปราะบาง</b> รับดาเมจ +50% (นับลดทุกเทิร์น)</li>
    <li>🥀 <b>อ่อนแรง</b> ทำดาเมจ −25% (นับลดทุกเทิร์น)</li>

    <h3>🛒 ระหว่างทาง</h3>
    <ul><li><b>ชนะ</b> ได้ <b>ผงดาว ✨</b> (เก็บถาวร ใช้สร้างไพ่ในสมุดไพ่) และทอง</li>
    <li><b>ร้านเครื่องราง</b> ใช้ทองซื้อเครื่องรางชั่วคราวเฉพาะรอบนี้ และยาฟื้น HP</li>
    <li><b>กองไฟ</b> ฟื้น HP 30% หรือ เปลี่ยนไพ่ต่อสู้ 1 ใบ (เฉพาะรอบนี้)</li></ul>

    <h3>🌟 นอกรอบ</h3>
    <ul><li><b>วิหารดวงดาว</b> สุ่มไพ่อาร์คานาด้วยตั๋วหรือเพชร (ต้นแบบนี้ไม่มีการเก็บเงินจริง)</li>
    <li><b>ไพ่ซ้ำ</b> ปลุกพลังภาพไพ่ (×2 กรอบเงิน · ×3 กรอบทอง · ×5 ภาพพิเศษ · ×7 เคลื่อนไหว)</li>
    <li>ครบ 3 ใบ ปลดล็อก <b>ร่างที่สอง</b> (บางใบ) · เกิน 7 ใบได้ผงดวงดาว ใช้สร้างไพ่ที่ต้องการ</li>
    <li>จบรอบ (แพ้ก็ได้) ได้เพชรและตั๋ว · ผงดาวได้ทุกครั้งที่ชนะการต่อสู้</li></ul>

    <h3>💍 เครื่องราง</h3>
    <ul><li>เครื่องรางมี <b>12 ชนิด 4 ระดับ</b> (I สามัญ · II ดี · III หายาก · IV ตำนาน) เก็บถาวร ใช้ได้ทุกรอบ</li>
    <li>ก่อนออกผจญภัย <b>สวมใส่ได้ 2 ช่อง</b> (ชนิดเดียวกันใส่ซ้ำไม่ได้) จากหน้า "💍 เครื่องราง" หรือหน้าสรุปไพ่</li>
    <li>เครื่องรางเป็นตัวช่วยเรื่อง <b>ฟื้นตัว ป้องกัน จังหวะ และทรัพยากร</b> ไม่ใช่ดาเมจตรง ๆ</li></ul>
    วิธีได้มา ที่ <b>🔨 ร้านช่างตี</b>:
    <ul><li><b>ร้านเหรียญ</b> ขายระดับ I ด้วย 🪙 เหรียญ (ได้จากการเล่นจบรอบ) สุ่มมา 6 ชิ้น ชนิดละ 1 ชิ้น <b>เปลี่ยนทุก 30 นาที</b></li>
    <li><b>รวมเครื่องราง</b> ชนิดเดียวกันระดับเดียวกัน เป็นระดับถัดไป (I→II ใช้ 2 · II→III ใช้ 3 · III→IV ใช้ 5 ชิ้น) สำเร็จแน่นอน</li>
    <li><b>สุ่มด้วยเพชร</b> ได้ระดับ II ขึ้นไป (ระดับ IV ออกน้อยมาก เน้นได้จากการรวม) · มี pity รับประกันระดับ III ทุก 30 ครั้ง (ต้นแบบนี้ไม่มีการเก็บเงินจริง)</li>
    <li>ชิ้นที่สวมใส่อยู่ ถูกนำไปรวมไม่ได้</li></ul>

    <h3>💡 เคล็ดลับสู้บอส</h3>
    <ul><li>มังกรเพิ่มพลังเรื่อย ๆ ยิ่งสู้นานยิ่งอันตราย ต้องตีให้จบเร็ว</li>
    <li>เทิร์นที่มันเพิ่มพลังหรือตั้งเกราะ คือจังหวะบุก</li>
    <li>ดูบรรทัด "ถัดไป" แล้วเก็บไพ่เกราะกับพลังงานไว้รับท่าแรง · ปล่อยท่าไม้ตายในจังหวะที่ได้ผลสูงสุด</li>
    <li>เข้าห้องบอสด้วย HP มากที่สุดเท่าที่ทำได้ · กองไฟก่อนบอสเลือกฟื้น HP</li></ul>
  </div><button class="btn sec close" onclick="closeModal()">ปิด</button>`);
}
function showMyArcana() {
  const a = G.arc, M = ARC[a.major.id], u = ULTS[M.el];
  openModal(`<h2>🔮 ไพ่ประจำรอบของคุณ</h2>
    <div class="arow" style="--ec:${EL[M.el].c}"><span class="ai">${M.icon}</span><span><b>${M.en}</b>${a.major.rev ? ' 🔻' : ''}<br>${eff(a.major).d(arcValue(eff(a.major), a.major.rev))}<br>
      <small>🌟 ท่าไม้ตาย: <b>${u.name}</b> — ${u.d(a.major.rev ? 1.3 : 1)}</small></span></div>
    ${a.minors.map(e => { const A = ARC[e.id]; return `<div class="arow" style="--ec:${EL[A.el].c}"><span class="ai">${ROLE[A.role].ic}</span><span>
      <b>${A.sk}</b> <small>${A.th} · ⚡${A.cost}${e.rev ? ' · 🔻 กลับหัว' : ''}</small><br>${kitDesc(A, e.rev, minorMult(a.major, e))}</span></div>`; }).join('')}
    <button class="btn sec close" onclick="closeModal()">ปิด</button>`);
}

// ================= ประตู · หอคอย · ตัวละคร =================
function doorHTML(d, i) {
  const t = d.t, N = NODE[t];
  let body;
  if (d.eid) {
    const e = ENEMIES[d.eid], hp = Math.round((e.hp[0] + e.hp[1]) / 2 * (1 + TIER_HP * (G.tier - 1)) * ENEMY_HP_K);
    const exp = Math.round(EXPV[t] * tierExpMult(G.tier) * expMult(G.first, G.lv0, G.tier));
    const extra = t === 'elite' ? '<br>ผงดาว + ทอง มากกว่าปกติ' : t === 'boss' ? '<br>ชนะเพื่อปลดล็อกชั้นถัดไป' : '<br>ได้ผงดาว + ทอง';
    body = `<span class="dart">${e.art}</span><span class="dinfo"><b>${N.ic} ${t === 'boss' ? 'บอส · ' : ''}${enemyName(e, elOf(e, G.tier))}</b><small>HP ~${hp} · ⭐ +${exp} EXP · ${EL[elOf(e, G.tier)].ic} ธาตุ${EL[elOf(e, G.tier)].th} · 🎯 อ่อนต่อ ${EL[wkOf(e, G.tier)].ic}${(() => { const M = ARC[G.arc.major.id].el, el = elOf(e, G.tier); return BEATS[M] === el ? ' · ✅ Major ชนะธาตุนี้' : BEATS[el] === M ? ' · ⚠ Major แพ้ธาตุนี้' : ''; })()}${extra}</small></span>`;
  } else if (t === 'shop') body = `<span class="dart">🛒</span><span class="dinfo"><b>ร้านเครื่องราง</b><small>ซื้อเครื่องรางชั่วคราว (เฉพาะรอบนี้) · ยาฟื้น HP</small></span>`;
  else body = `<span class="dart">🔥</span><span class="dinfo"><b>กองไฟ</b><small>ฟื้น HP ${pct(REST.frac * G.mods.restMult)} หรือเปลี่ยนไพ่ต่อสู้ 1 ใบ</small></span>`;
  return `<button class="door ${t}" onclick="chooseDoor(${i})">${body}<span class="dgo">▶</span></button>`;
}
function selectTier(t) {
  if (t > SAVE.tower.cleared + 1) return toast(`🔒 ต้องชนะบอสชั้น ${t - 1} ก่อน`);
  SAVE.tower.sel = t; persist(); render();
}

function powerChips() {
  const em = equippedMajor();
  const m = buildMods({major:{id:em.id, rev:em.rev, form:canAlt(em.id) && SAVE.form[em.id] === 2 ? 2 : 1}, minors:ensureKit().filter(Boolean)}, SAVE.amu.equip.filter(Boolean), SAVE.hero.stats);
  const c = [`❤ HP สูงสุด ${Math.max(20, BASE_HP + m.maxHp)}`, `⚡ เกจสูงสุด ${MAXE + m.maxGauge} (ฟื้น +${REGEN}/เทิร์น)`, `🌟 หลอดพลังพิเศษ ${Math.max(5, ULT_MAX - m.ultCut)}`];
  if (m.startBlock) c.push(`🛡 เกราะเริ่มต้น ${m.startBlock}`);
  if (m.turnBlock) c.push(`🛡 เกราะทุกเทิร์น +${m.turnBlock}`);
  if (m.startStr) c.push(`💪 พลังเริ่มต้น ${m.startStr}`);
  if (m.firstAtk) c.push(`🗡 โจมตีใบแรก +${m.firstAtk}`);
  if (m.allAtk) c.push(`🗡 โจมตีทุกใบ +${m.allAtk}`);
  if (m.dmgPct) c.push(`🗡 ดาเมจ +${Math.round(m.dmgPct * 100)}%`);
  if (m.healWin) c.push(`💚 ฟื้น HP หลังชนะ ${m.healWin}`);
  if (m.startThorns) c.push(`⛓ หนาม ${m.startThorns}`);
  if (m.goldMult) c.push(`💰 ทอง +${Math.round(m.goldMult * 100)}%`);
  if (m.dustMult) c.push(`✨ ผงดาว ${m.dustMult > 0 ? '+' : ''}${Math.round(m.dustMult * 100)}%`);
  return c;
}

function spendPt(k) {
  const h = SAVE.hero;

function resetStats() {
  const h = SAVE.hero, used = Object.values(h.stats).reduce((a, b) => a + b, 0);
  if (!used) return toast('ยังไม่ได้ใช้แต้ม');
  if (SAVE.amu.coins < RESET_COST) return toast('เหรียญไม่พอ');
  SAVE.amu.coins -= RESET_COST; h.points += used; h.stats = {vit:0, str:0, def:0, int:0, luck:0}; persist(); render();
}

        : `💡 ด่านถัดไปคือบอส · HP ${G.hp}/${G.maxHp}${G.doors.some(d => d.t === 'rest') ? ' · มีกองไฟให้พักก่อนเข้าบอส' : ''}`}</div>` : ''}
    ${G.doors.map(doorHTML).join('')}
  </div>`,

  tower: () => {
    const T = SAVE.tower, lv = SAVE.hero.level, sel = Math.min(T.sel || 1, T.cleared + 1, TIERS);
    return `<div class="screen"><h2>🏰 หอคอย</h2>${walletHTML()}
    <div class="muted">🧙 Lv ${lv} · ผ่านถึงชั้น ${T.cleared}/${TIERS}<br>ชนะบอสเพื่อปลดล็อกชั้นถัดไป · เล่นชั้นที่ผ่านแล้วซ้ำได้ แต่ได้ EXP ${pct(REPLAY_EXP)}<br>(ลดอีก ${pct(OVER_LV_PENALTY)} ต่อเลเวลที่เกินเลเวลแนะนำ)</div>
    ${Array.from({length:TIERS}, (_, i) => i + 1).map(t => {
      const locked = t > T.cleared + 1, done = t <= T.cleared, m = expMult(!done, lv, t);
      return `<button class="trow ${t === sel ? 'sel' : ''} ${locked ? 'lock' : ''}" onclick="selectTier(${t})">
        <span class="tn">${locked ? '🔒' : done ? '✓' : '▶'} ${t}</span>
        <span class="tinfo"><b>ชั้น ${t}</b><small>แนะนำ Lv ${recLevel(t)} · ศัตรู HP ×${(1 + TIER_HP * (t - 1)).toFixed(1)} · ดาเมจ ×${(1 + TIER_DMG * (t - 1)).toFixed(2)}</small></span>
        <span class="texp">${!locked && lv < recLevel(t) - 3 ? '⚠ ' : ''}⭐×${(tierExpMult(t) * m).toFixed(2)}<small>${done ? 'เล่นซ้ำ' : 'ครั้งแรก'}</small></span></button>`; }).join('')}
    <div class="muted">${lv < recLevel(sel) - 3 ? '⚠ เลเวลของคุณต่ำกว่าที่แนะนำมาก · ลองฟาร์มชั้นล่างก่อนก็ได้' : ''}</div>
    <div class="startbar" style="gap:8px"><button class="btn sec" onclick="screen='title';render()">กลับ</button>
      <button class="btn" onclick="startTier()">⚔️ เตรียมตัวเข้าชั้น ${sel}</button></div>
    <button class="link-btn" onclick="devUnlockTiers()">🧪 ทดสอบ: ปลดล็อกทุกชั้น</button>
  </div>`; },

  hero: () => {
    const h = SAVE.hero, need = h.level >= LV_MAX ? 0 : expNeed(h.level), em = equippedMajor(), A = ARC[em.id];
    const showM = {id:em.id, rev:em.rev, form:canAlt(em.id) && SAVE.form[em.id] === 2 ? 2 : 1};
    return `<div class="screen"><h2>🧙 ตัวละคร</h2>${walletHTML()}
    <div class="box" style="text-align:center"><b style="font-size:22px">Lv ${h.level}${h.level >= LV_MAX ? ' (สูงสุด)' : ''}</b>
      ${need ? `<div class="expbar"><i style="width:${h.exp / need * 100}%"></i><span>${h.exp}/${need} EXP</span></div>` : ''}
      แต้มสถานะคงเหลือ: <b style="color:#ffd25a;font-size:18px">${h.points}</b></div>

    <div class="sect">✦ ไพ่หลัก (Major) ที่สวมใส่</div>
    <div class="mjrow">${tarotHTML(showM, null, '', 'style="cursor:default"')}
      <div class="mjctl">
        <b>${A.en} · ${A.th}</b><span style="opacity:.75">มี ${copies(em.id)} ใบ</span>
        <button class="btn" style="padding:8px 12px;font-size:14px" onclick="pickMajor()">🔄 เปลี่ยนไพ่</button>
        ${artBtn(em.id, 'padding:8px 12px;font-size:14px')}
        <button class="btn sec" style="padding:8px 12px;font-size:14px" onclick="toggleMajorRev()">${canRev(em.id) ? (em.rev ? '🔼 สลับเป็นหงาย' : '🔻 สลับเป็นกลับหัว') : `🔒 กลับหัว (ครบ ${REV_AT} ใบ · มี ${copies(em.id)})`}</button>
        ${A.alt ? `<button class="btn sec" style="padding:8px 12px;font-size:14px" onclick="toggleMajorForm()">${canAlt(em.id) ? '🔁 สลับร่าง' : `🔒 ร่างที่สอง (ครบ ${ALT_AT} ใบ · มี ${copies(em.id)})`}</button>` : ''}
      </div></div>
    <div class="muted">🌟 ท่าไม้ตาย (ธาตุ${EL[A.el].th}): <b>${ULTS[A.el].name}</b><br>${ULTS[A.el].d(em.rev ? 1.3 : 1)}</div>

    <div class="sect">🃏 ไพ่ต่อสู้ (Minor ${KIT_SLOTS} ช่อง)</div>
    <div class="muted">Minor ที่ติดตั้งคือไพ่ที่ใช้ในการต่อสู้ · แตะช่องเพื่อเปลี่ยน · ธาตุเดียวกับ Major ได้ผล +25%</div>
    <div class="kitslots">${ensureKit().map((e, i) => { const KA = e && ARC[e.id];
      return e ? `<div class="kslot"><div onclick="pickKit(${i})">${tarotHTML({id:e.id, rev:e.rev, form:1}, {id:em.id, rev:em.rev}, 'small')}</div>
        <button class="link-btn" onclick="kitRev(${i})">${canRev(e.id) ? (e.rev ? '🔼 หงาย' : '🔻 กลับหัว') : `🔒 ${copies(e.id)}/${REV_AT}`}</button></div>`
      : `<div class="kslot"><button class="kempty" onclick="pickKit(${i})">+<small>ช่อง ${i + 1}</small></button></div>`; }).join('')}</div>

    <div class="sect">💍 เครื่องราง</div>
    <div class="chosen">${equipText()}</div>
    <button class="btn sec" onclick="amuBack='hero';screen='amulets';render()">💍 จัดเครื่องราง</button>

    <div class="sect">📊 พลังรวมตอนนี้</div>
    <div class="pchips">${powerChips().map(t => `<span>${t}</span>`).join('')}</div>

    <div class="sect">⭐ สถานะ</div>
    ${STATS.map(st => { const pt = h.stats[st.k]; return `<div class="amu"><span class="ai2">${st.icon}</span>
      <div class="ainfo"><b>${st.name} <span style="color:#ffd25a">${pt}/${STAT_CAP}</span></b><small>${st.d(pt)}<br><span style="opacity:.7">${st.per}</span></small></div>
      <button class="btn" style="padding:7px 16px" onclick="spendPt('${st.k}')" ${h.points > 0 && pt < STAT_CAP ? '' : 'disabled'}>＋</button></div>`; }).join('')}
    <button class="btn sec" onclick="resetStats()">♻️ รีเซ็ตแต้ม (🪙 ${RESET_COST})</button>
    <div class="muted">ขึ้นเลเวลละ ${PTS_PER_LV} แต้ม · สถานะละไม่เกิน ${STAT_CAP} แต้ม · เลเวลสูงสุด ${LV_MAX}</div>
    <button class="link-btn" onclick="devExp(500)">🧪 ทดสอบ: +500 EXP</button>
    <div class="startbar"><button class="btn" onclick="screen='title';render()">กลับ</button></div>
  </div>`; },

  combat: () => {
    const M = ARC[G.arc.major.id], u = ULTS[M.el], ready = C.ult >= C.ultMax;
    return `${topbar()}
    <div class="enemy-zone" onclick="if(C.sel!==null){C.sel=null;render()}">
      <div class="intent">${intentText()}</div>
      <div class="enemy-art ${C.shakeE ? 'shake' : ''}" id="enemyEl">${E.art}</div>
      <div class="ename">${E.name} ${E.tag ? `<small>· ${E.tag}</small>` : ''}</div>
      <div class="bar"><i style="width:${E.hp / E.maxHp * 100}%"></i><span>${E.hp}/${E.maxHp}</span></div>
      <div class="bar brk"><i style="width:${E.brk / E.brkMax * 100}%"></i><span>${E.stun ? '😵 มึน!' : `💢 Break ${E.brk}/${E.brkMax}`}</span></div>
      <div class="stains">🧪 ตรา ${[0, 1].map(i => C.stains[i] ? `<span class="sd" style="--ec:${EL[C.stains[i]].c}">${EL[C.stains[i]].ic}</span>` : `<span class="sd" style="--ec:#555;opacity:.4">·</span>`).join('')}
        ${C.stains.length === 2 ? (C.stains[0] === C.stains[1] ? `<span class="rx">✨ ไพ่ธาตุนี้ใบถัดไป +25%</span>` : (R => `<span class="rx">${R.ic} ${R.n}: ${R.d} (ใช้ไพ่ใบถัดไป)</span>`)(REACT[reactKey(C.stains[0], C.stains[1])])) : ''}</div>
      <div class="statuses">
        <span class="st wk">${EL[E.el].ic} ธาตุ${EL[E.el].th} · 🎯 อ่อนต่อ ${EL[E.wk].ic} ×${WEAK_K} · ⬇ ทน ${EL[E.res].ic} ×${RES_K}</span>
        ${E.block ? `<span class="st blk">🛡 ${E.block}</span>` : ''}
        ${E.str ? `<span class="st">💪 พลัง ${E.str}</span>` : ''}
        ${E.vuln ? `<span class="st">🎯 เปราะบาง ${E.vuln}</span>` : ''}
        ${E.weak ? `<span class="st">🥀 อ่อนแรง ${E.weak}</span>` : ''}
      </div>
    </div>
    <div class="hint">${C.sel !== null ? (() => { const c = C.kit[C.sel], cost = kitCost(c); return `
      <button class="mini up" onclick="playKit(C.sel)" ${c.used || cost > C.energy ? 'disabled style="opacity:.4"' : ''}>▲ ใช้ไพ่ (⚡${cost})</button>`; })()
      : `<span class="pillc">🃏 ใช้แล้ว ${C.played}/${C.kit.length}</span><span class="tip">แตะการ์ด 2 ครั้ง หรือลากขึ้น = ใช้ · ใบละ 1 ครั้ง/เทิร์น</span>`}</div>
    <div class="player-zone">
      <div class="energy">⚡${C.energy}<small style="font-size:11px">/${C.maxE}</small></div>
      <div class="pinfo ${C.shakeP ? 'shake' : ''}" id="playerEl">
        <div class="bar"><i style="width:${G.hp / G.maxHp * 100}%"></i><span>🛡️ อัศวิน ${G.hp}/${G.maxHp}</span></div>
        <div class="statuses">
          ${C.block ? `<span class="st blk">🛡 เกราะ ${C.block}</span>` : ''}
          ${C.str ? `<span class="st">💪 พลัง ${C.str}</span>` : ''}
          ${C.strT ? `<span class="st">💪 +${C.strT} เทิร์นนี้</span>` : ''}
          ${C.thorns ? `<span class="st">⛓️ หนาม ${C.thorns}</span>` : ''}
          ${C.reflectT ? `<span class="st">⛓️ สะท้อน ${C.reflectT} เทิร์นนี้</span>` : ''}
          ${C.guard ? `<span class="st blk">🛡 ตั้งรับ (ดาเมจ −50%)</span>` : ''}
        </div>
      </div>
    </div>
    <div class="hand" id="hand">${C.kit.map(kitCardHTML).join('')}</div>
    <div class="controls">
      <button class="ultbtn ${ready ? 'ready' : ''}" style="--ec:${EL[M.el].c}" onclick="useUlt()">🌟 ${u.name}<small>${ready ? 'พร้อมใช้! แตะเพื่อปล่อย' : `ชาร์จ ${C.ult}/${C.ultMax}`}</small>
        <i style="width:${C.ult / C.ultMax * 100}%"></i></button>
      <button class="basicbtn" onclick="basicAtk()" ${C.basicUsed ? 'disabled' : ''}>👊<small>ฟรี<br>+1⚡</small></button>
      <button class="basicbtn" onclick="guard()" ${C.guard || C.energy < 1 ? 'disabled' : ''}>🛡<small>ตั้งรับ<br>−1⚡</small></button>
      <button class="btn" onclick="endTurn()" ${C.busy ? 'disabled' : ''}>จบเทิร์น</button>
    </div>`;
  },

  reward: () => `${topbar()}<div class="screen" style="justify-content:center">
    <div style="font-size:64px">🏆</div><h2>ชนะ!</h2>
    <div class="box" style="text-align:center;font-size:17px">✨ ผงดาว <b style="color:#c9b6ff">+${G.reward.dust}</b><br>💰 ทอง <b style="color:#ffd25a">+${G.reward.gold}</b></div>
    <div class="muted">ผงดาวใช้สร้างไพ่ในสมุดไพ่ (เก็บไว้ถาวร แม้แพ้ในรอบนี้)<br>ผงดาวรวมรอบนี้ ${G.dustGot}</div>
    <button class="btn" onclick="nextFloor()">ไปต่อ ▶</button></div>`,

  shop: () => `${topbar()}<div class="screen">
    <h2>🛒 ร้านเครื่องราง</h2>
    <div class="muted">เครื่องรางที่ซื้อที่นี่ใช้ได้เฉพาะรอบนี้ (ไม่กินช่องสวมใส่)</div>
    ${G.shop.items.map((it, i) => { const a = AMU[it.id]; return `<div class="amu" style="${it.sold ? 'opacity:.35' : ''}"><span class="ai2">${a.icon}</span>
      <div class="ainfo"><b>${a.name} <span style="color:${TCOLOR[it.tier]}">${TROM[it.tier]}</span></b><small>${amuText(a.id, it.tier)}</small></div>
      <button class="btn" style="padding:7px 12px;font-size:13px" onclick="buyRelic(${i})" ${it.sold ? 'disabled' : ''}>${it.sold ? 'ขายแล้ว' : '💰 ' + it.price}</button></div>`; }).join('')}
    <div class="amu" style="${G.shop.potion ? 'opacity:.35' : ''}"><span class="ai2">🧪</span><div class="ainfo"><b>ยาฟื้นฟู</b><small>ฟื้น HP 30% ของ HP สูงสุด</small></div>
      <button class="btn" style="padding:7px 12px;font-size:13px" onclick="buyPotion()" ${G.shop.potion ? 'disabled' : ''}>${G.shop.potion ? 'ขายแล้ว' : '💰 ' + G.shop.potionPrice}</button></div>
    <button class="btn" onclick="nextFloor()">ออกจากร้าน</button></div>`,

  rest: () => `${topbar()}<div class="screen" style="justify-content:center">
    <div style="font-size:72px">🔥</div><h2>กองไฟ</h2>
    <div class="choice">
      <button class="btn" onclick="restHeal()">😴 พักผ่อน: ฟื้น HP (+${Math.min(G.maxHp - G.hp, restAmount())})</button>
      <button class="btn sec" onclick="restSwap()">🔄 เตรียมตัว: เปลี่ยนไพ่ต่อสู้ 1 ใบ</button>
    </div></div>`,

  over: () => `<div class="screen" style="justify-content:center">
    <div style="font-size:72px">💀</div><h1>พ่ายแพ้</h1>
    <div class="muted">ชั้น ${G.tier} · ไปได้ถึงด่าน ${G.stage}/${STAGES}</div>
    ${earnHTML()}
    <button class="btn" onclick="screen='tower';render()">🏰 กลับหอคอย</button>
    <button class="btn sec" onclick="screen='title';render()">หน้าแรก</button></div>`,

  victory: () => `<div class="screen" style="justify-content:center">
    <div style="font-size:72px">🏆</div><h1>ผ่านชั้น ${G.tier} แล้ว!</h1>
    <div class="muted">HP เหลือ ${G.hp}/${G.maxHp}${G.tier >= TIERS ? '<br>🎉 ไต่ถึงยอดหอคอยแล้ว!' : ''}</div>
    ${earnHTML()}
    ${G.tier < TIERS ? `<button class="btn" onclick="SAVE.tower.sel=${G.tier + 1};persist();beginArcana()">🏰 ขึ้นชั้น ${G.tier + 1}</button>` : ''}
    <button class="btn sec" onclick="screen='tower';render()">🏰 กลับหอคอย</button></div>`,
};

function render() {
  app.innerHTML = SCREENS[screen]();
  if (screen === 'combat' && C) { bindHand(); flushFx(); C.shakeE = C.shakeP = false; }
}

// ================= ควบคุมการ์ดในมือ (แตะ / ลาก) =================
function bindHand() {
  const hand = $('#hand');
  hand.querySelectorAll('.kcard').forEach(el => {
    const i = +el.dataset.i;
    let sx = 0, sy = 0, down = false, drag = false;
    el.onpointerdown = e => {
      if (C.busy) return;
      down = true; drag = false; sx = e.clientX; sy = e.clientY;
      el.setPointerCapture(e.pointerId);
    };
    el.onpointermove = e => {
      if (!down) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!drag && Math.hypot(dx, dy) > 10) { drag = true; el.classList.add('drag'); el.classList.remove('sel'); }
      if (drag) el.style.transform = `translate(${dx}px,${dy}px) scale(1.2)`;
    };
    el.onpointerup = e => {
      if (!down) return;
      down = false;
      if (drag) {
        if (e.clientY - sy < -70) return playKit(i);
        C.sel = null; render();
      } else if (C.sel === i) playKit(i);
      else { C.sel = i; render(); }
    };
    el.onpointercancel = () => { down = false; render(); };
  });
}

if (typeof setInterval === 'function') setInterval(() => {
  if (screen !== 'forge') return;
  if (SAVE.amu.shop && SAVE.amu.shop.slot !== shopSlot()) return render();
  const el = $('#shopTimer'); if (el) el.textContent = fmtLeft(shopLeftMs());
}, 1000);

render();
</script>
</body>
</html>
