<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Knight's Deck — ต้นแบบ</title>
<style>
:root{--gold:#e6b422;--txt:#f1ece4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0c0a10;color:var(--txt);font-family:-apple-system,"Sukhumvit Set","Thonburi","Noto Sans Thai","Leelawadee UI",sans-serif;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;height:100dvh;background:radial-gradient(ellipse at top,#2c2240,#15121c 70%);position:relative;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:none;cursor:pointer;background:none}
.btn{background:linear-gradient(#e0ac3a,#9a6c16);color:#1a1206;font-weight:700;padding:11px 20px;border-radius:12px;box-shadow:0 3px 0 #5a3f0c;font-size:16px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5a3f0c}
.btn.sec{background:linear-gradient(#4a4060,#2e2840);color:var(--txt);box-shadow:0 3px 0 #1a1624}
.btn:disabled{opacity:.4}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(0,0,0,.4);font-size:14px;gap:6px}
.pill{background:rgba(255,255,255,.09);padding:4px 10px;border-radius:20px;font-size:14px}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:14px;gap:12px}
h1{font-size:32px;text-align:center;color:var(--gold);text-shadow:0 2px 10px #000}
h2{font-size:21px;text-align:center;color:var(--gold)}
.muted{opacity:.7;font-size:13px;text-align:center;line-height:1.5}
.box{background:rgba(0,0,0,.3);border-radius:12px;padding:12px;width:100%;line-height:1.6;font-size:14px}
.link-btn{text-decoration:underline;opacity:.8;font-size:13px}

/* ---------- การ์ด ---------- */
.card{--w:100px;--rc:#888;width:var(--w);height:calc(var(--w)*1.42);border-radius:calc(var(--w)*.1);background:linear-gradient(160deg,#352d44,#1a1622);border:2px solid var(--rc);position:relative;display:flex;flex-direction:column;padding:calc(var(--w)*.045);color:var(--txt);user-select:none;-webkit-user-select:none;touch-action:none;flex-shrink:0;font-size:calc(var(--w)*.1);transition:transform .15s,margin .15s;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.card.r-starter{--rc:#8a8a8a}
.card.r-common{--rc:#9fc0dd}
.card.r-uncommon{--rc:#b07cf0;box-shadow:0 0 10px rgba(176,124,240,.4)}
.card.r-rare{--rc:#f2c443;box-shadow:0 0 14px rgba(242,196,67,.65);background:linear-gradient(160deg,#4a3a20,#1f1810)}
.card .cost{position:absolute;top:calc(var(--w)*-.07);left:calc(var(--w)*-.07);width:calc(var(--w)*.28);height:calc(var(--w)*.28);border-radius:50%;background:radial-gradient(circle at 35% 35%,#7cc0ff,#1f4f9a);border:2px solid #f2d27a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--w)*.16);z-index:2}
.card .cname{text-align:center;font-weight:700;padding:2px 2px 2px calc(var(--w)*.14);border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--w)*.105)}
.t-atk .cname{background:#7a2a2a}.t-skill .cname{background:#2a547a}.t-power .cname{background:#5d3f82}
.card .art{flex:0 0 34%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--w)*.3);margin:3px 0;border-radius:6px;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(0,0,0,.25))}
.card .ctype{text-align:center;opacity:.7;font-size:calc(var(--w)*.08)}
.card .cdesc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.25;padding:1px}
.card .ex{font-size:calc(var(--w)*.08);color:#ffb38a;font-style:italic}
.card .dis{font-size:calc(var(--w)*.078);text-align:center;line-height:1.2;padding:2px 1px 0;border-top:1px dashed rgba(255,255,255,.2);color:#cfe3ff}
.card .dis.rec{color:#ffe27a}
.card .up{color:#7ef08a;font-weight:800}.card .down{color:#ff8a7a;font-weight:800}
.card.cant{filter:grayscale(.75) brightness(.7)}
.grid{display:flex;flex-wrap:wrap;gap:14px 12px;justify-content:center;padding:6px 0}
.grid .card{cursor:pointer}

/* ---------- ไพ่ทาโรต์ (อาร์คานา) ---------- */
.tarot{--ec:#888;width:108px;min-height:190px;border-radius:10px;background:linear-gradient(160deg,#2b2140,#15101f);border:2px solid #c9a24a;box-shadow:inset 0 0 0 3px #15101f,inset 0 0 0 4px rgba(201,162,74,.45),0 4px 12px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;padding:9px 6px;gap:2px;text-align:center;font-size:10.5px;cursor:pointer;color:var(--txt);flex-shrink:0}
.tarot.minor{border-color:#8fa3b8;box-shadow:inset 0 0 0 3px #15101f,inset 0 0 0 4px rgba(143,163,184,.4),0 4px 12px rgba(0,0,0,.5)}
.tarot .num{font-family:Georgia,serif;color:#e6c46a;font-size:13px;letter-spacing:1px}
.tarot .ticon{font-size:38px;margin:3px 0;filter:drop-shadow(0 0 8px var(--ec))}
.tarot.rev .ticon{transform:rotate(180deg)}
.tarot .en{font-family:Georgia,serif;font-size:10.5px;color:#e6c46a;line-height:1.2}
.tarot .th{font-weight:700;font-size:12px;line-height:1.25}
.tarot .el{font-size:9.5px;padding:1px 7px;border-radius:8px;background:var(--ec);color:#111;font-weight:700;margin-top:2px}
.tarot .td{line-height:1.3;margin-top:4px}
.tarot .bad{color:#ff8a7a;font-size:9.5px;line-height:1.3;margin-top:2px}
.tarot .revtag{color:#ff8a7a;font-weight:700;font-size:10px;margin-top:2px}
.tarot .syn{color:#7ef08a;font-size:9.5px;line-height:1.3;margin-top:2px}
.tarot.small{width:96px;min-height:0;font-size:9.5px;cursor:default}
.tarot.small .ticon{font-size:28px}
.tarot{position:relative;overflow:hidden}
.tarot .lv{position:absolute;top:4px;right:6px;font-size:9px;color:#ffd25a;font-weight:700}
.tarot .formtag{font-size:9.5px;color:#9fd8ff;font-weight:700}
.tarot.none{filter:grayscale(1) brightness(.45)}
/* ระดับภาพไพ่ตามจำนวนที่สะสม */
.tarot.f-silver{border-color:#e3e8ee;box-shadow:inset 0 0 0 3px #15101f,inset 0 0 0 4px rgba(227,232,238,.6),0 0 10px rgba(227,232,238,.35)}
.tarot.f-gold,.tarot.f-alt,.tarot.f-anim{border-color:#ffd25a;box-shadow:inset 0 0 0 3px #15101f,inset 0 0 0 4px rgba(255,210,90,.6),0 0 16px rgba(255,210,90,.55)}
.tarot.f-gold::after,.tarot.f-alt::after,.tarot.f-anim::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.2) 45%,rgba(160,220,255,.16) 55%,transparent 70%);background-size:250% 100%;animation:holo 3s linear infinite}
@keyframes holo{from{background-position:150% 0}to{background-position:-100% 0}}
.tarot.f-alt,.tarot.f-anim{background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#ffe9a8,transparent),radial-gradient(1px 1px at 30% 80%,#fff,transparent),radial-gradient(circle at 50% 30%,#3b2a6e,#120c24 70%)}
.tarot.f-anim .ticon{animation:floaty 2.4s ease-in-out infinite}
.tarot.rev.f-anim .ticon{animation-name:floatyRev}
@keyframes floaty{50%{transform:translateY(-5px) scale(1.08)}}
@keyframes floatyRev{0%,100%{transform:rotate(180deg)}50%{transform:rotate(180deg) translateY(5px) scale(1.08)}}
.wallet{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.ctile{--ec:#888;aspect-ratio:3/4.2;border-radius:8px;background:linear-gradient(160deg,#2b2140,#15101f);border:2px solid #6a6a78;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:2px;position:relative;color:var(--txt)}
.ctile .ci{font-size:24px;filter:drop-shadow(0 0 6px var(--ec))}
.ctile.none{filter:grayscale(1) brightness(.35)}
.ctile .cnt{position:absolute;bottom:3px;right:5px;font-weight:700;color:var(--gold)}
.ctile .alt{position:absolute;top:3px;left:4px;font-size:10px}
.ctile.l2{border-color:#e3e8ee}
.ctile.l3{border-color:#ffd25a;box-shadow:0 0 8px rgba(255,210,90,.5)}
.ctile.l5,.ctile.l7{border-color:#ffd25a;box-shadow:0 0 8px rgba(255,210,90,.5);background:radial-gradient(circle at 50% 30%,#3b2a6e,#120c24 75%)}
.ctile.l7 .ci{animation:floaty 2.4s ease-in-out infinite}
.pullres{display:flex;flex-direction:column;align-items:center;gap:4px}
.pullres .tag{font-size:11px;font-weight:700;text-align:center;line-height:1.3;max-width:100px}
.pullres .tarot{animation:pop .7s ease-out both}
.arcbar{display:flex;justify-content:center;align-items:center;gap:8px;padding:4px;background:rgba(0,0,0,.25);font-size:12px}
.arcbar .ai{font-size:18px;display:inline-block}
.arcbar .ai.rev{transform:rotate(180deg)}
.arow{--ec:#888;display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px;border-radius:10px;background:rgba(255,255,255,.04);border-left:3px solid var(--ec);font-size:12px;line-height:1.45;text-align:left}
.arow .ai{font-size:24px;width:32px;text-align:center;flex-shrink:0}
.arow small{opacity:.8}
.arow .bad{color:#ff8a7a}
.sect{width:100%;font-weight:700;color:var(--gold);margin-top:8px}
.chosen{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:13px;background:rgba(0,0,0,.3);padding:6px 12px;border-radius:12px}

/* ---------- ต่อสู้ ---------- */
.enemy-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;min-height:0}
.intent{background:rgba(0,0,0,.55);padding:5px 12px;border-radius:14px;font-size:15px;border:1px solid rgba(255,255,255,.15)}
.enemy-art{font-size:86px;line-height:1.1;filter:drop-shadow(0 6px 12px #000)}
.ename{font-weight:700;font-size:16px}
.ename small{color:#ff9a6a;font-weight:400}
.bar{width:210px;height:16px;background:#3a1010;border-radius:8px;overflow:hidden;position:relative;border:1px solid #000}
.bar>i{display:block;height:100%;background:linear-gradient(#e25555,#a42020);transition:width .3s}
.bar>span{position:absolute;inset:0;font-size:11px;text-align:center;line-height:15px;font-weight:700;text-shadow:0 1px 2px #000}
.statuses{display:flex;flex-wrap:wrap;gap:5px;font-size:12px;justify-content:center;min-height:20px}
.st{background:rgba(0,0,0,.5);padding:2px 7px;border-radius:10px}
.st.blk{background:#1f4f7a}
.player-zone{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(0,0,0,.35)}
.energy{width:54px;height:54px;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd76a,#c26a00);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#2a1600;border:3px solid #ffeab0;box-shadow:0 0 12px rgba(255,200,80,.5)}
.pinfo{flex:1;display:flex;flex-direction:column;gap:4px}
.pinfo .bar{width:100%}
.pinfo .statuses{justify-content:flex-start}
.hand{height:170px;display:flex;justify-content:center;align-items:flex-end;padding:0 8px 4px;flex-shrink:0}
.hand .card{--w:82px}
.hand .card.sel{transform:translateY(-46px) scale(1.45);z-index:20}
.hand .card.drag{z-index:30;transition:none}
.hint{display:flex;justify-content:center;align-items:center;gap:8px;font-size:12px;height:34px;padding:0 8px}
.hint .mini{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:5px 9px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.hint .mini.up{border-color:#e6b422}
.hint .tip{opacity:.6}
.hint .pillc{background:rgba(0,0,0,.45);padding:3px 8px;border-radius:9px}
.hint .pillc.full{color:#ff9a8a}
.st.trap{background:#2d3f5c}
.controls{display:flex;justify-content:space-between;align-items:center;padding:4px 12px 14px}
.pile{font-size:13px;background:rgba(0,0,0,.45);padding:7px 11px;border-radius:10px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.float{position:fixed;pointer-events:none;font-weight:800;font-size:22px;text-shadow:0 2px 4px #000,0 0 2px #000;animation:floatup 1s forwards;z-index:999;white-space:nowrap}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
.toast{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(120,20,20,.92);padding:10px 18px;border-radius:10px;z-index:500;font-weight:700;animation:fade 1.4s forwards;text-align:center;max-width:85%}
.toast.info{background:rgba(30,26,44,.96);border:1px solid rgba(255,255,255,.2);font-weight:400;line-height:1.5}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}

/* ---------- แผนที่ / ร้านค้า / โมดัล ---------- */
.map{display:flex;flex-direction:column;align-items:center;width:100%}
.node{display:flex;align-items:center;gap:10px;width:80%;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.35);font-size:15px}
.node .ic{font-size:24px}
.node.done{opacity:.4}
.node.cur{background:rgba(230,180,34,.2);border:2px solid var(--gold);box-shadow:0 0 12px rgba(230,180,34,.35)}
.node .ok{margin-left:auto}
.link{width:2px;height:12px;background:rgba(255,255,255,.2)}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:6px}
.shopitem.sold{opacity:.25;pointer-events:none}
.price{font-size:14px;font-weight:700;color:var(--gold)}
.svc{display:flex;gap:10px;width:100%}
.svc>button{flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px;line-height:1.5;font-size:14px}
.svc>button:disabled{opacity:.35}
.modal{position:absolute;inset:0;background:rgba(5,3,8,.94);display:flex;flex-direction:column;align-items:center;z-index:100;padding:14px;overflow-y:auto;gap:10px}
.modal .close{position:sticky;bottom:0}
.reveal .card{--w:160px;animation:pop .8s ease-out}
.reveal-t .tarot{animation:pop .8s ease-out}
@keyframes pop{0%{transform:scale(.2) rotateY(180deg);opacity:0}70%{transform:scale(1.12) rotateY(0)}100%{transform:scale(1)}}
.rlabel{font-size:22px;font-weight:800}
.choice{display:flex;flex-direction:column;gap:10px;width:100%}
.choice .btn{width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ================= ข้อมูลพื้นฐาน =================
const RAR = {starter:'พื้นฐาน', common:'ธรรมดา', uncommon:'หายาก', rare:'ตำนาน'};
const RCOLOR = {starter:'#aaa', common:'#9fc0dd', uncommon:'#b07cf0', rare:'#f2c443'};
const TYPE = {atk:'โจมตี', skill:'ทักษะ', power:'พลัง'};
const MAXE = 5, HAND = 5, HAND_MAX = 7, PLAY_LIMIT = 3, REV_CHANCE = 0.3, TRAP_LIMIT = 2;
let REGEN = 1;   // พลังงานที่ฟื้นทุกต้นเทิร์น

let screen = 'title', G = null, C = null, E = null, uidN = 0;

// ================= ตัวคำนวณ (รวมผลของไพ่อาร์คานาใน G.mods) =================
const shown = (d, n) => d > n ? `<span class="up">${d}</span>` : d < n ? `<span class="down">${d}</span>` : d;
function calcDmg(n, mult = 1) {
  const m = G.mods;
  let d = n + C.str * mult;
  if (C.atkCount === 0) d += m.firstAtk;
  d += m.allAtk;
  d *= 1 + m.dmgPct;
  if (C.played === 1) d *= 1 + m.secondMult;
  d = Math.floor(d);
  if (E.vuln > 0) d = Math.floor(d * (1.5 + m.vulnBonus));
  return Math.max(0, d);
}
function blockAmt(n) {
  const m = G.mods;
  n = (n + m.blockFlat) * (1 + m.blockPct);
  if (C && C.played === 1) n *= 1 + m.secondMult;
  return Math.max(0, Math.floor(n));
}
// ตัวเลขบนการ์ด: เขียว = สูงขึ้น แดง = ต่ำลง
const D = (n, mult = 1) => C && E ? shown(calcDmg(n, mult), n) : n;
const B = n => C ? shown(blockAmt(n), n) : n;

// ================= ฟังก์ชันที่การ์ดเรียกใช้ =================
function atk(n, mult = 1) { hurtEnemy(calcDmg(n, mult)); }
function hurtEnemy(d) {
  if (E.hp <= 0) return;
  const b = Math.min(E.block, d);
  E.block -= b; d -= b;
  E.hp = Math.max(0, E.hp - d);
  fx('enemy', d > 0 ? `-${d}` : 'ป้องกัน', d > 0 ? '#ff6b6b' : '#9fc0dd');
  if (d > 0) C.shakeE = true;
}
function block(n) {
  if (n <= 0) return;
  n = blockAmt(n);
  C.block += n;
  fx('player', `+${n} 🛡`, '#8fd0ff');
  if (C.wrath) hurtEnemy(C.wrath);
}
function applyE(k, n) {
  E[k] += n;
  fx('enemy', (k === 'vuln' ? '🎯 เปราะบาง +' : '🥀 อ่อนแรง +') + n, '#e0b0ff');
}
function heal(n) {
  const h = Math.min(n, G.maxHp - G.hp);
  G.hp += h;
  fx('player', `+${h} ❤`, '#7ef08a');
}
function draw(n) {
  for (let i = 0; i < n; i++) {
    if (C.hand.length >= HAND_MAX) break;
    if (!C.draw.length) {
      if (!C.discard.length) break;
      C.draw = shuffle(C.discard); C.discard = [];
    }
    C.hand.push(C.draw.pop());
  }
}

// ================= การ์ดอัศวิน 30 ใบ =================
const CARDS = [
  // --- พื้นฐาน (3) ---
  {id:'strike', name:'ฟาดดาบ', cost:1, type:'atk', rar:'starter', art:'⚔️',
   desc:()=>`ดาเมจ ${D(6)}`, play(){ atk(6); }},
  {id:'defend', name:'ยกโล่', cost:1, type:'skill', rar:'starter', art:'🛡️',
   desc:()=>`เกราะ ${B(5)}`, play(){ block(5); }},
  {id:'bash', name:'กระแทกโล่', cost:2, type:'atk', rar:'starter', art:'💥',
   desc:()=>`ดาเมจ ${D(8)}<br>เปราะบาง 2`, play(){ atk(8); applyE('vuln',2); }},

  // --- ธรรมดา (14) ---
  {id:'twin', name:'ฟันคู่', cost:1, type:'atk', rar:'common', art:'🗡️',
   desc:()=>`ดาเมจ ${D(4)} ×2`, play(){ atk(4); atk(4); }},
  {id:'ram', name:'โล่พุ่งชน', cost:1, type:'atk', rar:'common', art:'🐏',
   desc:()=>C?`ดาเมจเท่ากับเกราะ<br>(${D(C.block)})`:'ดาเมจเท่ากับเกราะที่มี', play(){ atk(C.block); }},
  {id:'slashguard', name:'ฟันพลางตั้งรับ', cost:1, type:'atk', rar:'common', art:'🤺',
   desc:()=>`ดาเมจ ${D(5)}<br>เกราะ ${B(5)}`, play(){ atk(5); block(5); }},
  {id:'quick', name:'จู่โจมฉับไว', cost:0, type:'atk', rar:'common', art:'⚡',
   desc:()=>`ดาเมจ ${D(3)}<br>จั่ว 1`, play(){ atk(3); draw(1); }},
  {id:'heavy', name:'ดาบหนัก', cost:2, type:'atk', rar:'common', art:'🪓',
   desc:()=>`ดาเมจ ${D(14)}`, play(){ atk(14); }},
  {id:'expose', name:'ฟันเปิดช่อง', cost:1, type:'atk', rar:'common', art:'🎯',
   desc:()=>`ดาเมจ ${D(5)}<br>เปราะบาง 1`, play(){ atk(5); applyE('vuln',1); }},
  {id:'reopen', name:'แทงซ้ำแผล', cost:1, type:'atk', rar:'common', art:'🩸',
   desc:()=>`ดาเมจ ${D(E&&E.vuln>0?12:6)}<br>ศัตรูเปราะบาง: ×2`, play(){ atk(E.vuln>0?12:6); }},

    MINORS.push({id:`${s}-${r}`, suit:s, rank:r, no:r === 1 ? 'A' : String(r), en:`${RANK_EN[r-1]} of ${S.en}`,

  }
  COURTS[s].forEach((c, k) => MINORS.push({id:`${s}-${11 + k}`, suit:s, rank:11 + k, no:c.en.toUpperCase(), en:`${c.en} of ${S.en}`,
    th:`${c.th}แห่ง${S.th}`, icon:S.icon, el:S.el, bad:S.bad, v:c.v, rv:c.rv, d:c.d, f:c.f, w:3, court:true}));

const ARC = Object.fromEntries([...MAJORS, ...MINORS].map(a => [a.id, a]));

// ร่างที่สอง (ปลดล็อกเมื่อสะสมครบ 3 ใบ) — ไม่แรงกว่า แค่ต่างแนว · ตัวอย่าง 6 ใบ
const ALTS = {
  M7:        {v:2, rv:3, d:v=>`การ์ดโจมตีทุกใบ ดาเมจ +${v}`, f:(m,v)=>m.allAtk+=v},             // The Chariot

  M18:       {v:2, rv:3, d:v=>`ศัตรูเริ่มการต่อสู้ด้วยเปราะบาง ${v}`, f:(m,v)=>m.startEnemyVuln+=v}, // The Moon

// ผลของไพ่ตามร่างที่ใช้อยู่ (e = {id, rev, form})
const eff = e => e.form === 2 && ARC[e.id].alt ? {...ARC[e.id], ...ARC[e.id].alt} : ARC[e.id];

// ค่าผลจริงของไพ่ (กลับหัว = ค่า rv, แล้วคูณตัวคูณของ Minor)
function arcValue(A, rev, mult = 1) {
  const x = (rev ? A.rv : A.v) * mult;
  // ปัดขึ้นเพื่อให้โบนัสเห็นผลเสมอ (เช่น 1 × 1.25 → 2)
  return Number.isInteger(A.v) ? Math.ceil(x - 1e-9) : Math.round(x * 100) / 100;
}
// ตัวคูณของ Minor: The World ×1.5 / ธาตุตรงกับ Major ×1.25
function minorMult(major, e) {
  if (!major) return 1;
  let k = major.id === WORLD ? 1 + arcValue(ARC[WORLD], major.rev) : 1;
  if (ARC[e.id].el === ARC[major.id].el) k *= 1.25;
  return k;
}
function buildMods(arc) {
  const m = {maxHp:0, goldStart:0, startRares:0, turn1Draw:0, seeTop:0, healWin:0, startBlock:0,
    secondMult:0, firstAtk:0, startStr:0, hermit:0, rewardChoices:0, rareChance:0, reflect:0,
    freeRemove:false, removeGold:0, dmgCap:0, dmgPct:0, drain:0, startEnemyDmg:0, starHeal:0,
    startEnemyWeak:0, energyEvery3:0, drawEvery3:0, revive:0, enemyHpPct:0, enemyStr:0, shopPct:0, blockPct:0,
    restMult:1, startThorns:0, vulnBonus:0, blockFlat:0, zeroDraw:0, goldMult:0,
    allAtk:0, turnBlock:0, startEnemyVuln:0, turnEnemyDmg:0,
    maxGauge:0, startGauge:0, trapSlots:0, trapBlock:0, discardBonus:0, recycleBonus:0, sunFull:false};
  if (!arc) return m;
  const M = eff(arc.major);
  M.f(m, arcValue(M, arc.major.rev));
  if (arc.major.rev) BAD[M.bad].f(m);
  arc.minors.forEach(e => {
    const N = eff(e);
    N.f(m, arcValue(N, e.rev, minorMult(arc.major, e)));
    if (e.rev) BAD[N.bad].f(m);
  });
  return m;
}

function grant(id) {

  if (before >= MAX_COPIES) { const d = DUST[tierOf(A)]; SAVE.dust += d; return {id, before, dust:d}; }

}
function rollArc(forceMajor) {

  const majorChance = RATES.major + Math.max(0, SAVE.pity - 29) * 5;     // ซอฟต์ pity ตั้งแต่ครั้งที่ 30
  let tier;
  if (forceMajor || SAVE.pity >= 50 || Math.random() * 100 < majorChance) tier = 'major';
  else {
    const r = Math.random() * (100 - RATES.major);
    tier = r < RATES.court ? 'court' : r < RATES.court + RATES.high ? 'high' : 'low';
  }
  if (tier === 'major') { SAVE.pity = 0; return grant(pick(MAJORS).id); }

// ================= ดูดวงก่อนเริ่มรอบ: Major 3 เลือก 1 → Minor 3 เลือก 1 สองครั้ง =================
let AR = null;
const flip = () => Math.random() < REV_CHANCE;
const canAlt = id => !!ARC[id].alt && (SAVE.owned[id] || 0) >= ALT_AT;
const offer = id => ({id, rev:flip(), form: canAlt(id) && SAVE.form[id] === 2 ? 2 : 1});
function beginArcana() {
  AR = {step:0, major:null, minors:[], offers: shuffle(MAJORS.filter(M => SAVE.owned[M.id])).slice(0, 3).map(M => offer(M.id))};
  screen = 'arcana'; render();
}
function drawMinorOffers() {
  const out = [];
  while (out.length < 3) {
    const pool = MINORS.filter(n => SAVE.owned[n.id] && !AR.minors.some(x => x.id === n.id) && !out.some(x => x.id === n.id));
    if (!pool.length) break;
    out.push(offer(weighted(pool).id));
  }
  return out;
}
function chooseArc(i) {
  const e = AR.offers[i];
  if (AR.step === 0) AR.major = e; else AR.minors.push(e);
  AR.step++;
  AR.offers = AR.step <= 2 ? drawMinorOffers() : [];
  render();
}
function toggleRunForm(k) {
  const e = k ? AR.minors[k - 1] : AR.major;
  e.form = e.form === 2 ? 1 : 2;

}

  for (let i = 0; i < 4; i++) G.deck.push(inst('defend'));

function finishRun(win) {

}

// ================= ระบบต่อสู้ =================
function startCombat(eid) {
  const m = G.mods, d = ENEMIES[eid], hp = Math.round(rand(d.hp[0], d.hp[1]) * (1 + m.enemyHpPct));
  E = {...d, hp, maxHp:hp, block:0, str:m.enemyStr, vuln:0, weak:0, turn:0};
  const maxE = MAXE + m.maxGauge;
  C = {draw:shuffle(G.deck), hand:[], discard:[], exhaust:[], maxE, energy:Math.max(0, maxE + m.startGauge), block:0, str:0,
       thorns:0, plate:0, wrath:0, fortress:false, turn:0, played:0, atkCount:0, zeroDrawn:0, discarded:0, recUsed:false,
       traps:[], starUsed:false, sel:null, busy:false, fx:[], shakeE:false, shakeP:false};
  screen = 'combat'; startTurn();
}
function startTurn() {
  const m = G.mods;
  C.turn++; C.played = 0; C.atkCount = 0; C.zeroDrawn = 0; C.discarded = 0; C.recUsed = false;
  const first = C.turn === 1, third = C.turn % 3 === 0;
  if (!C.fortress) C.block = 0;
  // เกจพลังงาน: เริ่มเต็ม แล้วฟื้นทุกต้นเทิร์น ไม่เกินเพดาน
  if (!first) gainE(REGEN, false);
  if (third && m.energyEvery3) gainE(m.energyEvery3);
  if (third && m.sunFull) { C.energy = C.maxE; fx('player', '☀️ เกจเต็ม', '#ffd76a'); }
  if (m.drain) { G.hp = Math.max(1, G.hp - m.drain); fx('player', `😈 -${m.drain}`, '#ff6b6b'); }
  if (first) {
    if (m.startBlock) block(m.startBlock);
    if (m.startStr) { C.str += m.startStr; fx('player', `💪 +${m.startStr}`, '#ffb347'); }
    if (m.startThorns) C.thorns += m.startThorns;
    if (m.startEnemyDmg) hurtEnemy(m.startEnemyDmg);
    if (m.startEnemyWeak) applyE('weak', m.startEnemyWeak);
    if (m.startEnemyVuln) applyE('vuln', m.startEnemyVuln);
  }
  if (m.turnBlock) block(m.turnBlock);
  if (m.turnEnemyDmg) hurtEnemy(m.turnEnemyDmg);
  // ไพ่ที่ไม่ได้ใช้อยู่ในมือต่อ · เติมให้ครบ 5 แล้วจึงจั่วโบนัส (มือสูงสุด 7)
  let bonus = (first ? m.turn1Draw : 0) + (third ? m.drawEvery3 : 0);
  if (m.hermit && G.deck.length <= m.hermit) bonus++;
  draw(Math.max(first ? 1 : 0, Math.max(0, HAND - C.hand.length) + bonus));
  fireTraps('next');
  C.traps = [];                              // กับดักที่ไม่ทำงานหมดอายุ
  if (C.plate) block(C.plate);
  render();
  checkWin();
}
function gainE(n, show = true) {
  const before = C.energy;
  C.energy = Math.min(C.maxE, C.energy + n);
  if (show && C.energy > before) fx('player', `+${C.energy - before} ⚡`, '#ffd76a');
}
// ทำงานกับดักตามจังหวะ · f() คืน false = เงื่อนไขไม่เข้า ยังไม่ใช้
function fireTraps(on) {
  C.traps = C.traps.filter(t => {
    if (t.on !== on) return true;
    if (CARD[t.id].dis.f() === false) return true;
    fx('player', `⏳ ${CARD[t.id].name}`, '#cfe3ff');
    if (G.mods.trapBlock) block(G.mods.trapBlock);
    return false;
  });
}
function discardCard(i) {
  if (C.busy) return;
  const m = G.mods, card = C.hand[i], c = CARD[card.id];
  if (c.dis && c.dis.k === 'trap' && C.traps.length >= TRAP_LIMIT + m.trapSlots) {
    C.sel = null; render(); toast(`วางกับดักได้สูงสุด ${TRAP_LIMIT + m.trapSlots} อัน`); return;
  }
  C.hand.splice(i, 1); C.sel = null;
  C.discard.push(card);
  if (c.dis && c.dis.k === 'rec') {
    gainE(c.dis.n + (!C.recUsed ? m.recycleBonus : 0));
    C.recUsed = true;
  } else if (c.dis && c.dis.k === 'trap') {
    C.traps.push({id:c.id, on:c.dis.on});
    fx('player', `⏳ วางกับดัก`, '#cfe3ff');
  }
  if (C.discarded === 0 && m.discardBonus) gainE(m.discardBonus);
  C.discarded++;
  render();
}
function checkWin() {
  if (E.hp <= 0 && !C.busy) { C.busy = true; setTimeout(winCombat, 700); }
}
function playCard(i) {
  if (C.busy) return;
  const m = G.mods, card = C.hand[i], c = CARD[card.id];
  if (C.played >= PLAY_LIMIT) { C.sel = null; render(); toast(`ออกไพ่ได้ ${PLAY_LIMIT} ใบต่อเทิร์น<br><small>ทิ้งการ์ดยังทำได้</small>`); return; }
  if (c.cost > C.energy) { C.sel = null; render(); toast('พลังงานไม่พอ'); return; }
  C.energy -= c.cost;
  C.hand.splice(i, 1);
  C.sel = null;
  c.play();
  if (c.cost === 0 && C.zeroDrawn < m.zeroDraw) { C.zeroDrawn++; draw(1); }
  C.played++;
  if (c.type === 'atk') C.atkCount++;
  if (c.type === 'power') {}               // การ์ดพลังออกจากเกมหลังใช้
  else if (c.exhaust) C.exhaust.push(card);
  else C.discard.push(card);
  render();
  checkWin();
}
function endTurn() {
  if (C.busy) return;
  C.busy = true;
  C.sel = null; C.played = 0;                // ไพ่ที่เหลืออยู่ในมือต่อ
  render();
  setTimeout(enemyTurn, 450);
}
const enemyDmg = base => Math.floor((base + E.str) * (E.weak > 0 ? .75 : 1));
function enemyTurn() {
  const m = G.mods;
  E.block = 0;
  const it = E.pattern[E.turn % E.pattern.length];
  if (it.block) { E.block += it.block; fx('enemy', `+${it.block} 🛡`, '#8fd0ff'); }
  if (it.str) { E.str += it.str; fx('enemy', `💪 +${it.str}`, '#ffb347'); }
  if (it.atk) {
    fireTraps('hit');
    for (let h = 0; h < (it.hits || 1); h++) {
      let d = enemyDmg(it.atk);
      if (m.reflect) hurtEnemy(Math.floor(d * m.reflect));
      const b = Math.min(C.block, d); C.block -= b; d -= b;
      if (m.dmgCap) d = Math.min(d, m.dmgCap);
      G.hp = Math.max(0, G.hp - d);
      fx('player', d > 0 ? `-${d}` : 'ป้องกัน', d > 0 ? '#ff6b6b' : '#9fc0dd');
      if (d > 0) C.shakeP = true;
      if (C.thorns) hurtEnemy(C.thorns);
      if (m.starHeal && !C.starUsed && G.hp > 0 && G.hp < G.maxHp * .3) { C.starUsed = true; heal(m.starHeal); }
      if (G.hp <= 0) fireTraps('death');
      if (G.hp <= 0 && m.revive && !G.revived) {
        G.revived = true; G.hp = Math.round(G.maxHp * m.revive); fx('player', '📯 ฟื้นคืนชีพ!', '#ffe27a');
      }
      if (G.hp <= 0 || E.hp <= 0) break;
    }
  }
  if (G.hp > 0) fireTraps('end');
  E.turn++;
  if (E.vuln > 0) E.vuln--;
  if (E.weak > 0) E.weak--;
  render();
  if (G.hp <= 0) return setTimeout(() => finishRun(false), 800);
  if (E.hp <= 0) return setTimeout(winCombat, 700);
  setTimeout(() => { C.busy = false; startTurn(); }, 650);
}
function intentText() {
  const it = E.pattern[E.turn % E.pattern.length], parts = [];
  if (it.atk) parts.push(`🗡️ ${enemyDmg(it.atk)}${it.hits > 1 ? ' ×' + it.hits : ''}`);
  if (it.block) parts.push('🛡️ ป้องกัน');
  if (it.str) parts.push('💪 เพิ่มพลัง');
  return 'ศัตรูจะ: ' + parts.join(' + ');
}

// ================= รางวัล (สุ่มเลือก 1 + ระบบ pity) =================
function winCombat() {
  const m = G.mods, n = MAP[G.floor];
  const gold = Math.round((n.t === 'elite' ? rand(35, 45) : n.t === 'boss' ? 100 : rand(15, 25)) * (1 + m.goldMult));
  G.gold += gold;
  if (m.healWin) G.hp = Math.min(G.maxHp, G.hp + m.healWin);
  C = E = null;
  if (n.t === 'boss') return finishRun(true);
  const chance = Math.min(100, (n.t === 'elite' ? 20 : 8) + m.rareChance + G.pity * 4);
  const count = Math.max(1, Math.min(5, 3 + m.rewardChoices));
  const choices = pickCards(count, () => rollRarity(chance));
  G.pity = choices.some(id => CARD[id].rar === 'rare') ? 0 : G.pity + 1;
  G.reward = {gold, choices, chance};
  screen = 'reward'; render();
}
function takeReward(id) { G.deck.push(inst(id)); nextFloor(); }

      <b>สุ่ม 10 ครั้ง:</b> การันตี Major อย่างน้อย 1 ใบ<br>
      <b>ไพ่ซ้ำ:</b> ปลุกพลังภาพไพ่ (×2 เงิน · ×3 ทอง · ×5 ภาพที่สอง · ×7 เคลื่อนไหว) · ครบ 3 ใบปลดล็อกร่างที่สอง · เกิน 7 ใบแปลงเป็นผง</div>
    <div class="muted">นับ pity: ${SAVE.pity}/50 ครั้ง</div>
    <div class="svc">
      <button onclick="pull(1,true)" ${SAVE.tickets ? '' : 'disabled'}>🎫 สุ่ม 1<br><small>ใช้ตั๋ว 1 ใบ</small></button>
      <button onclick="pull(1)">💎 สุ่ม 1<br><small>${PULL_COST} เพชร</small></button>
      <button onclick="pull(10)">💎 สุ่ม 10<br><small>${PULL_COST * 10} เพชร</small></button>
    </div>
    <h2 style="font-size:16px;margin-top:6px">💎 เติมเพชร (จำลอง)</h2>
    <div class="svc">${GEM_PACKS.map((p, i) => `<button onclick="buyGems(${i})">💎 ${p.g}${SAVE.firstBuy[i] ? '' : ' <b style="color:#7ef08a">×2</b>'}<br><small>${p.p}</small></button>`).join('')}</div>
    <div class="muted">⚠ ต้นแบบนี้ไม่มีการเก็บเงินจริง · ×2 = โบนัสซื้อครั้งแรก</div>
    <button class="btn sec" onclick="screen='book';render()">📚 สมุดไพ่</button>
    <button class="btn sec" onclick="screen='title';render()">กลับ</button>
  </div>`,

  book: () => `<div class="screen">
    <h2>📚 สมุดไพ่ (${Object.keys(SAVE.owned).length}/78)</h2>${walletHTML()}
    <div class="muted">แตะไพ่เพื่อดูรายละเอียด สร้างไพ่ด้วยผง หรือสลับร่าง<br>🔁 = มีร่างที่สอง (🔒 ยังไม่ปลดล็อก)</div>
    <div class="sect">✦ Major Arcana</div><div class="cgrid">${MAJORS.map(ctile).join('')}</div>
    ${Object.entries(SUITS).map(([s, S]) => `<div class="sect">${S.icon} ${S.en} · ${S.th} — ธาตุ${EL[S.el].th}</div>
      <div class="cgrid">${MINORS.filter(n => n.suit === s).map(ctile).join('')}</div>`).join('')}
    <button class="link-btn" onclick="resetSave()">🧪 รีเซ็ตคอลเลกชัน (สำหรับทดสอบ)</button>
    <div class="startbar"><button class="btn sec" onclick="screen='title';render()">กลับ</button></div>
  </div>`,

  map: () => `${topbar()}<div class="screen">
    <h2>เส้นทางผจญภัย</h2>
    <div class="map">${MAP.map((n, k) => `<div class="node ${k < G.floor ? 'done' : k === G.floor ? 'cur' : ''}">
      <span class="ic">${NODE[n.t].ic}</span><span>${k + 1}. ${NODE[n.t].name}</span>${k < G.floor ? '<span class="ok">✓</span>' : ''}</div>`).join('<div class="link"></div>')}</div>
    <button class="btn" onclick="enterNode()">ไปต่อ: ${NODE[MAP[G.floor].t].ic} ${NODE[MAP[G.floor].t].name}</button></div>`,

  combat: () => `${topbar()}
    <div class="enemy-zone" onclick="if(C.sel!==null)playCard(C.sel)">
      <div class="intent">${intentText()}</div>
      <div class="enemy-art ${C.shakeE ? 'shake' : ''}" id="enemyEl">${E.art}</div>
      <div class="ename">${E.name} ${E.tag ? `<small>· ${E.tag}</small>` : ''}</div>
      <div class="bar"><i style="width:${E.hp / E.maxHp * 100}%"></i><span>${E.hp}/${E.maxHp}</span></div>
      <div class="statuses">
        ${E.block ? `<span class="st blk">🛡 ${E.block}</span>` : ''}
        ${E.str ? `<span class="st">💪 พลัง ${E.str}</span>` : ''}
        ${E.vuln ? `<span class="st">🎯 เปราะบาง ${E.vuln}</span>` : ''}
        ${E.weak ? `<span class="st">🥀 อ่อนแรง ${E.weak}</span>` : ''}
      </div>
    </div>
    <div class="hint">${C.sel !== null ? (() => { const c = CARD[C.hand[C.sel].id]; return `
      <button class="mini up" onclick="playCard(C.sel)" ${c.cost > C.energy || C.played >= PLAY_LIMIT ? 'disabled style="opacity:.4"' : ''}>▲ ใช้ (⚡${c.cost})</button>
      <button class="mini" onclick="discardCard(C.sel)">▼ ทิ้ง${c.dis ? ': ' + disText(c) : ''}</button>`; })()
      : `<span class="pillc ${C.played >= PLAY_LIMIT ? 'full' : ''}">🃏 ออกไพ่ ${C.played}/${PLAY_LIMIT}</span><span class="pillc">✋ มือ ${C.hand.length}/${HAND_MAX}</span><span class="tip">ขึ้น=ใช้ · ลง=ทิ้ง</span>`}</div>
    <div class="player-zone">
      <div class="energy">⚡${C.energy}<small style="font-size:11px">/${C.maxE}</small></div>
      <div class="pinfo ${C.shakeP ? 'shake' : ''}" id="playerEl">
        <div class="bar"><i style="width:${G.hp / G.maxHp * 100}%"></i><span>🛡️ อัศวิน ${G.hp}/${G.maxHp}</span></div>
        <div class="statuses">
          ${C.block ? `<span class="st blk">🛡 เกราะ ${C.block}</span>` : ''}
          ${C.str ? `<span class="st">💪 พลัง ${C.str}</span>` : ''}
          ${C.thorns ? `<span class="st">⛓️ หนาม ${C.thorns}</span>` : ''}
          ${C.plate ? `<span class="st">🎖️ เกราะเริ่มเทิร์น ${C.plate}</span>` : ''}
          ${C.wrath ? `<span class="st">🌩️ โทสะ ${C.wrath}</span>` : ''}
          ${C.fortress ? `<span class="st">🏰 ป้อมปราการ</span>` : ''}
          ${C.traps.map(t => `<span class="st trap">⏳ ${CARD[t.id].dis.s}</span>`).join('')}
        </div>
      </div>
    </div>
    <div class="hand" id="hand">${C.hand.map((c, i) =>
      cardHTML(c.id, `${CARD[c.id].cost > C.energy || C.played >= PLAY_LIMIT ? 'cant' : ''} ${C.sel === i ? 'sel' : ''}`, `data-i="${i}"`)).join('')}</div>
    <div class="controls">
      <button class="pile" onclick="showPile('draw')">📚 จั่ว ${C.draw.length}${G.mods.seeTop ? ' 📿' : ''}</button>
      <button class="btn" onclick="endTurn()" ${C.busy ? 'disabled' : ''}>จบเทิร์น</button>
      <button class="pile" onclick="showPile('discard')">🗑 ทิ้ง ${C.discard.length}</button>
    </div>`,

  reward: () => `${topbar()}<div class="screen">
    <h2>🏆 ชนะ!</h2><div>ได้รับ 💰 ${G.reward.gold}</div>
    <div class="muted">เลือกการ์ด 1 ใบเพิ่มเข้าสำรับ</div>
    <div class="grid">${G.reward.choices.map(id => cardHTML(id, '', `onclick="takeReward('${id}')"`)).join('')}</div>
    <button class="btn sec" onclick="nextFloor()">ข้าม (สำรับบางไว้ จั่วการ์ดดีได้บ่อยขึ้น)</button>
    <div class="box muted">🎲 โอกาสเจอการ์ด<b style="color:${RCOLOR.rare}">ตำนาน</b>ต่อใบรอบนี้: ${G.reward.chance}%<br>
      ระบบ pity: ถ้ารอบนี้ไม่เจอตำนาน รอบหน้าโอกาสจะเพิ่มขึ้น 4%</div></div>`,

  shop: () => `${topbar()}<div class="screen">
    <h2>🛒 ร้านค้าพ่อค้าเร่</h2>
    <div class="grid">${G.shop.items.map((it, i) => `<div class="shopitem ${it.sold ? 'sold' : ''}">
      ${cardHTML(it.id, '', `onclick="buyCard(${i})"`)}<div class="price">💰 ${it.price}</div></div>`).join('')}</div>
    <div class="svc">
      <button onclick="buyPack()">🎁 <b>ซองสุ่ม</b> 💰${G.shop.packPrice}<br>
        <small style="opacity:.75">ธรรมดา ${PACK.common}% · หายาก ${PACK.uncommon}% · ตำนาน ${PACK.rare}%</small></button>
      <button onclick="removeService()" ${G.shop.removed ? 'disabled' : ''}>🔥 <b>ลบการ์ด</b> ${removePrice() ? '💰' + removePrice() : 'ฟรี'}<br>
        <small style="opacity:.75">${G.shop.removed ? 'ใช้บริการแล้ว' : 'ทำให้สำรับคมขึ้น'}</small></button>
    </div>
    <button class="btn" onclick="nextFloor()">ออกจากร้าน</button></div>`,

  rest: () => `${topbar()}<div class="screen" style="justify-content:center">
    <div style="font-size:72px">🔥</div><h2>กองไฟ</h2>
    <div class="choice">
      <button class="btn" onclick="restHeal()">😴 พักผ่อน: ฟื้น HP (+${Math.min(G.maxHp - G.hp, restAmount())})</button>
      <button class="btn sec" onclick="restRemove()">✂️ ฝึกฝน: ลบการ์ด 1 ใบ</button>
    </div></div>`,

  over: () => `<div class="screen" style="justify-content:center">
    <div style="font-size:72px">💀</div><h1>พ่ายแพ้</h1>
    <div class="muted">ไปได้ถึงชั้น ${G.floor + 1} จาก ${MAP.length} · สำรับ ${G.deck.length} ใบ</div>
    ${earnHTML()}
    <button class="btn" onclick="beginArcana()">🔮 ดูดวงใหม่แล้วเริ่มอีกครั้ง</button>
    <button class="btn sec" onclick="screen='title';render()">หน้าแรก</button></div>`,

  victory: () => `<div class="screen" style="justify-content:center">
    <div style="font-size:72px">🏆</div><h1>โค่นมังกรได้แล้ว!</h1>
    <div class="muted">HP เหลือ ${G.hp}/${G.maxHp} · สำรับสุดท้าย ${G.deck.length} ใบ</div>
    ${earnHTML()}
    <button class="btn sec" onclick="showDeck()">ดูสำรับที่ชนะ</button>
    <button class="btn" onclick="beginArcana()">🔮 เล่นอีกครั้ง</button></div>`,
};

function render() {
  app.innerHTML = SCREENS[screen]();
  if (screen === 'combat' && C) { bindHand(); flushFx(); C.shakeE = C.shakeP = false; }
}

// ================= ควบคุมการ์ดในมือ (แตะ / ลาก) =================
function bindHand() {
  const hand = $('#hand'), els = [...hand.querySelectorAll('.card')], n = els.length;
  const W = hand.clientWidth - 16, cw = 82;
  const ov = n > 1 && n * cw > W ? (n * cw - W) / (n - 1) : -4;
  els.forEach((el, k) => {
    if (k > 0) el.style.marginLeft = (-ov) + 'px';
    const i = +el.dataset.i;
    let sx = 0, sy = 0, down = false, drag = false;
    el.onpointerdown = e => {
      if (C.busy) return;
      down = true; drag = false; sx = e.clientX; sy = e.clientY;
      el.setPointerCapture(e.pointerId);
    };
    el.onpointermove = e => {
      if (!down) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!drag && Math.hypot(dx, dy) > 10) { drag = true; el.classList.add('drag'); el.classList.remove('sel'); }
      if (drag) el.style.transform = `translate(${dx}px,${dy}px) scale(1.25)`;
    };
    el.onpointerup = e => {
      if (!down) return;
      down = false;
      if (drag) {
        if (e.clientY - sy < -80) return playCard(i);
        if (e.clientY - sy > 50) return discardCard(i);
        C.sel = null; render();
      } else if (C.sel === i) playCard(i);
      else { C.sel = i; render(); }
    };
    el.onpointercancel = () => { down = false; render(); };
  });
}

render();
</script>
